<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <title>APP 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  
  <style>
    :root{
      --color-primary:#3b82f6;
      --color-primary-dark:#1e3a8a;
      --color-glow:#60a5fa;
      --bg:#0b1220;
      --card:#0f1724;
      --muted:#9ca3af;
      --text:#e6f0ff;
    }
    html,body{
      height:100%
    }
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .max-w-4xl{
      max-width: 64rem;
      margin-left:auto;
      margin-right:auto;
    }
    .px-6{
      padding-left:1.5rem;
      padding-right:1.5rem;
    }
    .py-8{
      padding-top:2rem;
      padding-bottom:2rem;
    }
    .pb-footer{
      padding-bottom:5.5rem;
    }
    header{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      border-bottom:1px solid rgba(96,165,250,0.04);
    }
    .brand{
      font-weight:800;
      color:var(--text);
    }
    .card{
      background:linear-gradient(180deg, var(--card), rgba(10,14,22,0.8));
      border-radius:0.85rem;
      border:1px solid rgab(96,165,250,0.06);
      box-shadow:0 10px 30px rgba(2,6,23,0.6);
      transition:transform .28s cubic-beizer(.2,.9,.2,1), box-shadow .28s;
    }
    .card:hover{
      transform:translateY(-6px);
      box-shadow:0 22px 50px rgba(96,165,250,0.08);
      border-color:rgba(96,165,250,0.12);
    }
    .btn{
      background:transparent;
      color:var(--text);
      border-radius:0.65rem;
      padding:6rem 1rem;
      border:1px solid rgba(96,165,250,0.06);
      cursor:pointer;
      font-weight:900;
      box-shadow:0 6px 18px rgba(2,6,23,0.6);
      transition:all .18s ease;
    }
    .btn:hover{
      box-shadow:0 8px 22px rgba(96,165,250,0.06);
      transform:translateY(-2px);
    }
    .btn-primary{
      background:var(--color-primary);
      border:none;
    }
    .btn-primary:hover{
      background:var(--color-primary-dark);
    }
    .selected{
      box-shadow:0 0 18px rgba(96,165,250,0.12);
      border-color:var(--color-primary);
    }
    .message-wrapper{
      display:flex;
      align-items:flex-end;
      gap:.5rem;
      margin:.5rem 0;
    }
    .user-wrapper{
      justify-content:flex-end;
      flex-direction:row-reverse;
    }
    .message-avatar{
      width:34px;
      height:34px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      flex-shrink:0;
    }
    .bot-avatar{
      background:var(--color-primary-dark);
      color:white;
    }
    .user-avatar{
      background:var(--color-glow);
      color:white;
    }
    .message-bubble{
      padding:6rem .9rem;
      border-radius:14px;
      max-width:90%;
      line-height:1.9;
    }
    .bot-message{
      background:rgba(96,165,250,0.08);
      color:var(--text);
    }
    .user-message{
      background:var(--color-primary-dark);
      color:white;
      align-self:flex-end;
    }
    footer.global-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
      border-top:1px solid rgba(96,165,250,0.04);
      padding:5rem 0;
      backdrop-filter:blur(6px);
      height:40px;
    }
    .nav-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:.78rem;
      gap:25rem;
      padding:.35rem .5rem;
    }
    
    
      
    
      
      
  </style>
  
  <body class="min-h-screen pb-footer">
    <header class="sticky top-0 z-40">
      <div class="max-w-4xl px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-4"> 
          <button class="btn btn-primary flex items-center gap-3" id="brand-button">
            <span class="font-bold">APP 2026</span>
            <span class="border-1 border-white/30 pl-3 font-mono text-xs opacity-90" id=timer-display">00:00</span>
          </button>
        </div>
        <div class="text-sm text-blue-200" id="step-indicator">Step 1 of 5</div>
      </div>
    </header>

    <main class="max-w-4xl px-6 py-8">
      <section class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-blue-100 mb-2" id="step-title">Select a Topic</h1>
        <p class="text-sm text-gray-400 mb-4" id="step-breadcrumb"></p>
      </section>
      <div class="mb-6 flex justify-between items-center">
        <div class="hidden" id="back-button">
          <button class="btn" onclick="handleBack()"> ← Back </button>
        </div>
        <div class="hidden" id="reset-button">
          <button class="btn" onclick="resetSelection()"> Reset </button>
        </div>
      </div>

      <div class="grid gap-6" id="step-0">
        <div class="card p-6 cursor-pointer" id="topic-science" role="button" tabIndex="0">
          <div class="flex items-center justify-between"> 
          <h3 class="text-xl font-bold text-blue-200">Science</h3>
          <p class="text-sm text-gray-400 mt-1">Explore Physics, Chemistry, and Biology</p>
        </div>
        <div class="text-3xl"></div>
        </div>
      </div>

      <div class="hidden grid grid-cols-1 md:grid-cols-3 gap-6" id="step-1"></div>
      <div class="hidden grid grid-cols-1 md:grid-cols-2 gap-6" id="step-2">
        <div class="card p-6 text-center cursor-pointer" id="mode-descriptor" role="button" tabIndex="0">
          <div class="text-4xl mb-2">📚</div>
          <h3 class="font-bold text-lg text-blue-100">Descriptor-Based</h3>
          <p class="text-sm text-gray-400">Explanations, Discussions, and Medias</p>
        </div>
        <div class="card p-6 text-center cursor-pointer" id="mode-skill" role="button" tabIndex="0">
          <div class="text-4xl mb-2">🎯</div>
          <h3 class="font-bold text-lg text-blue-100">Skill-Based</h3>
          <p class="text-sm text-gray-400">Targeted quizzes and assessments (level 1-4).</p>
        </div>
      </div>
      
      <div class="hidden grid grid-cols-2 md:grid-cols-5 gap-4" id="step-3a"></div>
      <div class="hidden grid grid-cols-2 md:grid-cols-4 gap-4" id="step-3b"></div>
      
      <div class="hidden" id="step-4">
        <div class="card p-4">
          <div class="flex items-center gap-3 mb-3">
            <div class="text-xl">💬</div>
          </div>
          <div class="font-bold text-blue-100" id="chat-title">Learning Assistant</div>
          <div class="text-xs text-gray-400" id="chat-sub">Intearctive Chat</div>
        </div>
      </div>
      
      <div class="text-sm text-gray300 mb-3" id="chatbot-description"></div>
      <div class="chat-container mb-3" id="chat-container"></div>
      <div class="flex gap-3">
        <input class="flex-1 bg-transparent border border-gray-700 rounded-md px-3 py-2 text-sm" id="chat-input" placeholder="Type here and press Enter"/>
        <button class="btn btn-primary" onclick="handleSendMEssage()">Enter</button>
      </div>   
    </main>

    <footer class="global-nav">
      <div class="max-w-4xl px-6 flex justify-around">
        <div class="nav-item" onclick="goHOme()"><div>🏠</div><div>Home</div></div>
        <div class="nav-item" onclick="showInfo()"><div>ℹ️</div><div>About</div></div>
        <div class="nav-item cursor-pointer" onclick="toggleLabMenu()"><div id="lab-icon">🧪</div><div>Lab</div></div>
        <div class="nav-item" onclick="openSettings()"><div>⚙️</div><div>Settings</div></div>
      </div>
    </footer>

    
    
  </body>
