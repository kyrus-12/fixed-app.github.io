      'solutions': {
        title: 'Lesson 3: Solutions',
        modules: [
        { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to:<br>1. Identify common solutions found in daily life.<br><br> 2. Explain solute and solvent in simple terms.' },        
          { type: 'text', heading: 'Introduction', body: 'Have you ever mixed sugar into your juice or salt into your soup? When you stir it well, the sugar or salt seems to vanish but it’s still there! What you’ve made is called a solution.' },        
        { type: 'text', heading: 'What are Common Solutions?', body: 'A solution is a special mixture where one substance spreads evenly throughout another. Here are some common solutions you see every day:' },        
        { type: 'text', heading: '1. Salt in Water', body: 'When you add salt to water and stir, the salt particles spread out between the water particles. The result is a clear liquid. You can’t see the salt anymore, but you can taste it!' },        
        { type: 'image', url: 'https://imgur.com/xXOszV9.gif', caption: 'Salt in Water' },
        { type: 'text', heading: '2. Sugar in Coffee or Tea', body: 'Sugar dissolves in hot drinks just like salt dissolves in water. The sweet taste tells you the sugar is still there, even though you can’t see it.' },        
        { type: 'image', url: 'https://imgur.com/u3zZu6w.gif', caption: 'Sugar in Coffee' },
        { type: 'text', heading: '3. Milk in Chocolate Drink', body: 'When you mix chocolate powder with warm milk, the powder dissolves to make a smooth chocolate drink, that’s a solution too.' },        
        { type: 'image', url: 'https://imgur.com/gDbuJXf.gif', caption: 'Milk im Chocolate Drink' },
        { type: 'text', heading: '4. Air', body: 'Believe it or not, the air we breathe is a solution! It’s made of different gases like oxygen, nitrogen, and carbon dioxide, all mixed evenly together.' },        
        { type: 'image', url: 'https://imgur.com/IpG3R2W.png', caption: 'Air Molecules' },
        { type: 'text', heading: 'What are Solute and Solvent?', body: 'Every solution has two main parts, we call them solute and solvent:<br><b>• Solute:</b> This is the substance that gets dissolved. It’s the part you add to the mixture.<br><b>Example:</b> In salt water, the salt is the solute. In sweet coffee, the sugar is the solute.<br><br><b>• Solvent:</b> This is the substance that does the dissolving. It’s the part you add the solute to. Most of the time, the solvent is a liquid, and water is the most common solvent on Earth.<br><b>Example:</b> In salt water, the water is the solvent. In sweet coffee, the coffee/tea liquid is the solvent.' },        
        { type: 'text', heading: 'Simple Way to Remember', body: 'Solute = what is being dissolved<br>Solvent = what does the dissolving' },       
        { type: 'text', heading: 'Summary', body: '• A solution is a mixture where one substance spreads evenly throughout another.<br><br>• Common solutions include salt water, sweet coffee, chocolate milk, and air.<br><br>• Solute is the substance being dissolved; solvent is the substance that dissolves it.' },        
        { type: 'text', heading: 'References', body: 'https://giphy.com/gifs/caliper-fastacting-trycaliper-QOVNAGWM9RYlUVJBpo<br><br>https://giphy.com/explore/sugar-and-coffee-lol<br><br>https://thereedsvillecreamery.com/chocolate-milk-faqs/<br><br>http://safeinthecityct.weebly.com/trauma-and-emergency-centre/dive-right-into-it' },        
        ]
      }
    },
    2: {
      'use of models': {
        title: 'Lesson 1: Use of Models in Science',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Describe how models help scientists explain phenomena that cannot be seen directly. <br><br>2. Give specific examples of models used in science.' },        
        { type: 'text', heading: 'What are Scientific Models?', body: 'Scientific models are simplified representations of complex ideas, objects, or phenomena that cannot be observed directly with our senses. They help scientists organize information, make predictions, and explain how things work by breaking down complexity into something easier to understand and visualize. Models are not perfect copies of reality – they focus only on the most important features needed to study a specific problem.' },        
        { type: 'text', heading: 'How Models Help Explain Unobservable Phenomena', body: 'Many scientific concepts deal with things that are too small (like atoms), too large (like galaxies), too fast (like chemical reactions), too slow (like mountain formation), or too dangerous (like volcanic eruptions) to see directly. Models translate these abstract ideas into concrete forms that can be studied, discussed, and tested. For example, we cannot see an atom’s structure, but a model lets us picture how its parts are arranged and how they interact.' },        
        { type: 'image', url: 'https://imgur.com/c8LQKWc.gif', caption: 'Atoms' },
        { type: 'image', url: 'https://imgur.com/5q4KD3A.gif', caption: 'Galaxies' },
        { type: 'image', url: 'https://imgur.com/sV9cIM0.gif', caption: 'Mountain Formations' },
        { type: 'image', url: 'https://imgur.com/oyZlhe8.gif', caption: 'Volcanic Eruptions' },
        { type: 'image', url: 'https://imgur.com/opOYdjZ.gif', caption: 'Chemical Reactions' },
        { type: 'text', heading: 'Specific Examples of Scientific Models: <br><br>1. Atomic Models', body: 'Over time, scientists have developed different models to explain the structure of atoms. The Bohr model (with a central nucleus and electrons orbiting like planets) helps us understand how electrons are arranged and how atoms interact to form molecules – even though we cannot see individual atoms with the naked eye or most microscopes.' },        
        { type: 'image', url: 'https://imgur.com/VVHXRAk.gif', caption: 'Bohr Model' },
        { type: 'text', heading: '2. Weather Maps', body: 'These are visual models that use symbols, colors, and lines to represent atmospheric conditions like temperature, air pressure, wind direction, and precipitation. They help meteorologists predict weather patterns that are too large and dynamic to observe all at once from a single location.' },        
        { type: 'image', url: 'https://imgur.com/hq7JmYL.gif', caption: 'Weather Maps' },
        { type: 'text', heading: '3. Water Cycle Diagrams', body: 'These simplified drawings show how water moves between Earth’s surface, atmosphere, and underground. They highlight processes like evaporation, condensation, precipitation, and runoff, connecting observable events (like rain or a puddle drying up) to the larger, unseen cycle that distributes water across the planet.' },        
        { type: 'image', url: 'https://imgur.com/BtUMHHq.gif', caption: 'Water Cycle' },
        { type: 'text', heading: '4. DNA Double Helix Model', body: 'This physical or visual model represents the structure of DNA, which is too small to see directly. It explains how genetic information is stored and copied, helping scientists understand inheritance and develop treatments for genetic diseases.' },        
        { type: 'image', url: 'https://imgur.com/kM4PzOs.gif', caption: 'DNA Double Helix Strand' },
        { type: 'text', heading: 'References', body: 'https://giphy.com/explore/bohr-model <br><br> https://commons.wikimedia.org/wiki/File:Atom_animation.gif <br><br> https://www.philstar.com/headlines/2017/12/22/1770864/vinta-weakens-signal-no-2-11-areas <br><br> https://www.pinterest.com/pin/water-cycle-diagram-how-water-moves-through-the-environment--335870084719271027/ <br><br> https://in.pinterest.com/pin/30258628735337875/ <br><br> https://giphy.com/explore/galaxy-supernovas <br><br> https://imgur.com/gallery/mountain-building-via-plate-tectonics-uVKakbA <br><br> https://www.pinterest.com/pin/escape-into-a-captivating-fanfiction--391531761376212809/ <br><br> https://kaiserscience.wordpress.com/chemistry/chemical-reactions/' },        
        ]
      },
      'the particle model': {
        title: 'Lesson 2: The Particle Model of Matter',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Describe the basic Particle Model of Matter. <br><br>2. Recognize that particles are always in constant motion, even if it cannot be seen.' },        
        { type: 'text', heading: 'Basic Particle Model of Matter', body: 'The Particle Model of Matter is a scientific model that describes all substances as being made up of tiny, discrete particles (atoms, molecules, or ions) that have specific properties. The model has four core ideas:' },        
        { type: 'text', heading: '1. All matter is made of particles', body: 'Every solid, liquid, and gas is composed of tiny building blocks that are too small to see individually.' },        
        { type: 'text', heading: '2. Particles have space between them', body: 'The amount of space varies depending on the state of matter. Gases have the most space between particles, solids have the least.' },        
        { type: 'text', heading: '3. Particles are always in constant motion', body: 'Even when an object appears completely still, its particles are moving continuously.' },        
        { type: 'text', heading: '4. Particles attract each other', body: 'There are forces of attraction between particles; the strength of these forces also varies by state of matter.' },        
        { type: 'image', url: 'https://imgur.com/ZwRPBOD.gif', caption: 'Particle Model of Matter'},
        { type: 'text', heading: 'Constant Motion of Particles (Even When Unseen)', body: 'We cannot see particle motion directly, but we can observe evidence of it. For example: <br><br>• When you add a drop of food coloring to a glass of water, the color spreads out and mixes with the water over time. This is due to the random motion of water molecules and food coloring particles (called diffusion). <br><br>• If you leave a bottle of perfume open in a room, the scent will eventually spread to every corner. Perfume particles move through the air and into your nose. <br><br>• Even a solid like a metal spoon will expand slightly when heated. This happens because the particles move faster and move further apart as they gain energy.' },        
        { type: 'image', url: 'https://imgur.com/6ZryYm6.gif', caption: 'Spreading of Food Coloring Particles to a Glass of Water' },
        { type: 'image', url: 'https://imgur.com/hwwpdIm.gif', caption: 'Scattering of Perfume Particles into the Air' },
        { type: 'image', url: 'https://imgur.com/kLX3LwH.gif', caption: 'Expansion of Particles When a Metal Spoon is Heated' },
        { type: 'text', heading: 'References', body: 'https://commons.wikimedia.org/wiki/File:Dispersion.gif <br><br> https://giphy.com/explore/perfumes <br><br> https://gifzz.com/gifs/yxvgTi8D0pA7ypvrsEhD?page=12 <br><br>https://lms.eduqode.com/courses/science-iv/lesson/spark-your-neurons-%E2%9C%A8%F0%9F%92%A1%F0%9F%9A%80-i-effects-of-heat-on-solids-liquids-and-gases/' },        
        ]
      },
      'changes of state': {
        title: 'Lesson 3: Changes of States',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Identify the three main states of matter: solid, liquid, and gas. <br><br>2. Recognize common changes of state.' },
          { type: 'text', heading: 'The Three Main States of Matter', body: 'All matter on Earth exists in one of three primary states, distinguished by the arrangement, motion, and forces between particles:<br><br>1. Solid', body: 'Particles are tightly packed in a fixed, regular pattern. They vibrate in place but do not move past one another. Solids have a definite shape and volume (e.g., ice cubes, a wooden block, a metal coin).' },        
        { type: 'image', url: 'https://imgur.com/o16HVej.gif', caption: 'Particles of Solids' },
        { type: 'text', heading: '2. Liquid', body: 'Particles are close together but not in a fixed pattern. They can slide past one another, allowing liquids to flow. Liquids have a definite volume but take the shape of their container (e.g., water in a glass, milk, oil).' },        
        { type: 'image', url: 'https://imgur.com/QYkIuiJ.gif', caption: 'Particles of Liquids' },
        { type: 'text', heading: '3. Gas', body: 'Particles are far apart and move freely in all directions at high speeds. Gases have no definite shape or volume. They expand to fill their entire container (e.g., water vapor, air, helium in a balloon).' },        
        { type: 'image', url: 'https://imgur.com/N3YV2cv.gif', caption: 'Particles of Gases' },
        { type: 'text', heading: 'Common Changes of State', body: 'Changes of state occur when matter gains or loses thermal energy (heat). The most common changes are: <br><br>1. Melting', body: 'Solid to Liquid. When heat is added to a solid, particles gain energy, move faster, and break free from their fixed positions.' },        
        { type: 'image', url: 'https://imgur.com/xNRrX7A.gif', caption: 'Melting' },
        { type: 'text', heading: '2. Freezing', body: 'Liquid to Solid. When heat is removed from a liquid, particles lose energy, slow down, and lock into a fixed pattern.' },        
        { type: 'image', url: 'https://imgur.com/1qJZ2Az.gif', caption: 'Freezing' },
        { type: 'text', heading: '3. Evaporation', body: 'Liquid to Gas. When heat is added to a liquid, particles at the surface gain enough energy to escape into the air as vapor.' },        
        { type: 'image', url: 'https://imgur.com/XbTSZvP.gif', caption: 'Evaporation' },
        { type: 'text', heading: '4. Condensation', body: 'Gas to Liquid. When heat is removed from a gas, particles lose energy, slow down, and clump together to form liquid droplets.' },        
        { type: 'image', url: 'https://imgur.com/EvXLJjW.gif', caption: 'Condensation' },
        { type: 'text', heading: '5. Sublimation', body: 'Solid to Gas (without passing through the liquid state).' },                
        { type: 'image', url: 'https://imgur.com/p7Brse2.gif', caption: 'Sublimation' },
        { type: 'text', heading: 'References', body: 'https://commons.wikimedia.org/wiki/File:Gif_-AtomosSolido_01.gif<br><br>https://commons.wikimedia.org/wiki/File:Gif_-AtomosLiquid_03.gif<br><br>https://commons.wikimedia.org/wiki/File:Gif_-AtomosGas_02.gif<br><br>https://dribbble.com/shots/2408548-Melting-icecream-Animated-with-css<br><br>https://tenor.com/search/ice-water-gifs<br><br>https://medium.com/@quantumglyphs1/the-intricacies-of-water-evaporation-a-molecular-dance-below-boiling-point-76cbc98af52d<br><br>https://giphy.com/explore/condensation' },        
        ]
      },
      'solutions': {
        title: 'Lesson 4: Solutions',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Explain the specific role of solute and solvent in forming a solution.' },        
        { type: 'text', heading: 'What is a Solution?', body: 'A solution is a homogeneous mixture. Meaning it has a uniform composition throughout, with no visible separation of parts. Solutions are formed when one substance dissolves into another.' },        
        { type: 'text', heading: 'Specific Roles of Solute and Solvent', body: '<b>1. Solute:</b> The substance that is dissolved in the mixture. It is present in the smaller amount. Solutes can be solids, liquids, or gases.<br>Examples: <br>• In salt water, salt is the solute (solid dissolved in liquid). <br> • In soda water, carbon dioxide gas is the solute (gas dissolved in liquid). <br>• In vinegar, acetic acid is the solute (liquid dissolved in liquid). <br><br><b>2. Solvent:</b> The substance that does the dissolving. It is present in the larger amount and determines the state of the solution (most solvents are liquids, with water being the most common called the universal solvent). <br>Examples: <br>• In salt water, water is the solvent. <br>• In nail polish remover, acetone is the solvent (dissolves solid nail polish). <br>• In air (a gaseous solution), nitrogen gas is the solvent (dissolves oxygen, carbon dioxide, and other gases).' },        
        { type: 'text', heading: 'How Dissolving Works', body: 'When a solute dissolves in a solvent, the solvent particles surround and pull apart the solute particles, spreading them evenly throughout the mixture. For example, when salt dissolves in water, water molecules break apart the salt crystals into individual ions, which then disperse among the water molecules to form a uniform solution. Not all substances dissolve in all solvents. For example, oil (a nonpolar substance) does not dissolve in water (a polar substance), but it does dissolve in gasoline (a nonpolar solvent).' },        
        ]
      }
    },
    3: {
      'the particle model': {
        title: 'Lesson 1: The Particle Model (Advanced)',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Describe how particle motion and spacing differ between solids, liquids, and gases. <br><br>2. Explain that increasing temperature speeds up particle motion, while decreasing temperature slows it down.' },        
        { type: 'text', heading: 'How Particle Motion & Spacing Differ Across States of Matter', body: 'The Particle Model explains the unique properties of solids, liquids, and gases by focusing on particle arrangement, spacing, and motion – all of which are closely linked.' },        
        { type: 'image', url: 'https://imgur.com/swT3E0k.jpg', caption: 'Imgur: Balancing Equations' },
        { type: 'text', heading: 'Effect of Temperature on Particle Motion', body: 'Temperature is a measure of the average kinetic energy (energy of motion) of particles in a substance. <br><br>1. Increasing Temperature', body: 'Adds thermal energy to particles, increasing their kinetic energy. This makes them move faster and spread further apart.<br><br> For example: <br>• Heating a solid (like butter) causes particles to vibrate more vigorously until they break free from their fixed positions and melt into a liquid. <br><br>• Heating a liquid (like water) makes particles move faster until some gain enough energy to escape into the air as gas (evaporation or boiling).' },        
        { type: 'text', heading: '2. Decreasing Temperature', body: 'Removes thermal energy from particles, reducing their kinetic energy. This slows their motion and brings them closer together. <br><br>For example: <br>• Cooling a liquid (like water) slows particles until they lock into a fixed pattern and freeze into a solid (ice). <br>• Cooling a gas (like water vapor) slows particles until they clump together to form liquid droplets (condensation).' },               
         ]
      },
      'changes of state': {
        title: 'Lesson 2: Changes of State (Energy and Particle Arrangement)',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Explain changes of state by linking them to changes in particle arrangement and energy. <br><br>2. Analyze the energy changes involved in the particle.' },        
        { type: 'text', heading: 'Explaining Changes of State Through Particles & Energy', body: 'All changes of state are physical changes (the substance remains the same – e.g., water is still H₂O whether it’s ice, liquid, or vapor). They occur when particles gain or lose enough energy to alter their arrangement and motion. <br><br><b>1. Melting (Solid to Liquid)</b><br><br><b>Energy Change:</b> Heat is absorbed (endothermic process) – particles gain thermal energy. <br><br> <b>Particle Behavior:</b> The added energy increases vibration speed until particles break free from their fixed lattice structure. They can now slide past one another, forming a liquid. <br><br> <b>Example:</b> Ice melting into water at 0°C (32°F). The temperature remains constant during melting as energy is used to break particle bonds, not to increase temperature.' },        
        { type: 'text', heading: '2. Freezing (Liquid to Solid)', body: '<b>Energy Change:</b> Heat is released (exothermic process) – particles lose thermal energy. <br><br> <b>Particle Behavior:</b> As energy decreases, particles slow down and move closer together. Forces of attraction between particles lock them into a fixed, regular pattern, forming a solid. <br><br> <b>Example:</b> Water freezing into ice at 0°C. Again, temperature stays constant during freezing as energy is released when particle bonds form.' },        
        { type: 'text', heading: '3. Evaporation / Boiling (Liquid to Gas)', body: '<b>Energy Change:</b> Heat is absorbed (endothermic process) – particles gain thermal energy. <br><br> <b>• Evaporation:</b> Occurs at the surface of a liquid, at any temperature below its boiling point. Only high-energy surface particles escape into the air. <br><br> <b>• Boiling:</b> Occurs throughout the liquid at a specific temperature (boiling point). All particles gain enough energy to break free from each other. <br><br> <b>Particle Behavior:</b> Particles move fast enough to overcome attractive forces and spread far apart, moving freely as a gas. <br><br> <b>Example:</b> Water evaporating from a puddle on a warm day, or boiling into steam at 100°C (212°F) at sea level.' },  
        { type: 'text', heading: '4. Condensation (Gas to Liquid)', body: '<b>Energy Change:</b> Heat is released (exothermic process) – particles lose thermal energy. <br><br> <b>Particle Behavior:</b> As gas particles cool, they slow down and move closer together. Attractive forces pull them into clusters, forming liquid droplets. <br><br> <b>Example:</b> Water vapor condensing into droplets on a cold glass, or forming clouds when warm air rises and cools.' },        
        { type: 'text', heading: '5. Sublimation (Solid to Gas)', body: '<b>Sublimation:</b> Heat is absorbed; solid particles gain enough energy to jump directly to the gas state (no liquid phase). <br><br> <b>Example:</b> Dry ice (solid CO₂) turning into CO₂ gas at room temperature.' },        
        { type: 'text', heading: '6. Deposition (Gas to Solid)', body: '<b>Deposition:</b> Heat is released; gas particles lose energy and form a solid directly. <br><br> <b>Example:</b> Frost forming on a cold window pane when water vapor in air freezes without becoming liquid first.' },        
         ]
      },
      'scientific investigations': {
        title: 'Lesson 3: Scientific Investigations',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Follow the standard steps of a scientific investigation. <br><br>2. Make accurate measurements using standard units of measurement.' },        
        { type: 'text', heading: 'Standard Steps of a Scientific Investigation', body: 'A scientific investigation follows a structured process to answer questions about the natural world. Each step builds on the previous one to ensure results are reliable and valid.' },        
        { type: 'text', heading: '1. Observation', body: '<b>What it is:</b> Using your senses (sight, hearing, touch, smell, taste – safely!) or tools (microscopes, thermometers) to notice a pattern, event, or problem. <br><br> <b>Example:</b> You observe that sugar dissolves faster in hot water than in cold water.' },        
        { type: 'text', heading: '2. Ask a Question', body: '<b>What it is:</b> Formulating a clear, testable question based on your observation. It should focus on a single relationship between variables. <br><br> <b>Example:</b> How does water temperature affect the rate at which sugar dissolves?' },        
        { type: 'text', heading: '3. Form a Hypothesis', body: '<b>What it is:</b> A testable prediction or explanation for the question. It should be written as an If... then... because... statement. <br><br> <b>Example:</b> If water temperature is increased, then sugar will dissolve faster because higher temperatures speed up particle motion, helping solvent particles break down solute particles more quickly.' },        
        { type: 'text', heading: '4. Testing (Experiment)', body: '<b>What it is:</b> Designing and conducting a controlled experiment to test the hypothesis. A controlled experiment changes only one variable (independent variable) at a time, while keeping all others constant (controlled variables). <br><br> <b>Independent variable:</b> The factor you change (e.g., water temperature: 20°C, 50°C, 80°C). <br><br> <b>Dependent variable:</b> The factor you measure (e.g., time taken for sugar to fully dissolve). <br><br> <b>Controlled variables:</b> Factors kept the same (e.g., amount of sugar, amount of water, type of sugar, stirring speed). <br><br> <b>Example:</b> Measure how long it takes 10 grams of granulated sugar to dissolve in 100 mL of water at 20°C, 50°C, and 80°C – stirring each sample the same number of times.' },        
        { type: 'text', heading: '5. Analysis', body: '<b>What it is:</b> Organizing and interpreting data (using tables, graphs, or calculations) to see if it supports the hypothesis. <br><br> <b>Example:</b> Create a line graph showing water temperature on the x-axis and dissolution time on the y-axis. You might find that as temperature increases, dissolution time decreases.' },        
        { type: 'text', heading: '6. Conclusion', body: '<b>What it is:</b> Stating whether the data supports or rejects the hypothesis, and explaining what the results mean. If needed, suggest improvements for future experiments or new questions to investigate. <br><br> <b>Example:</b> The data supports the hypothesis that sugar dissolves faster in hotter water. Higher temperatures increase particle motion, which speeds up the dissolving process. Future tests could explore how stirring affects dissolution rate.' },        
        { type: 'text', heading: 'Making Accurate Measurements with Standard Units', body: 'Scientists use the International System of Units (SI) to ensure measurements are consistent and comparable worldwide. Key units for common measurements:<br><br><b>1. Mass</b><br><br>Measured in grams (g) or kilograms (kg) using a balance scale. Example: A sugar cube has a mass of ~2 grams.' },        
        { type: 'text', heading: '2. Volume', body: '• Liquids: Measured in liters (L) or milliliters (mL) using a graduated cylinder or beaker. Example: A soda can holds 330 mL of liquid. <br><br> • Solids: Calculated using length × width × height (for regular shapes) in cubic meters (m³) or cubic centimeters (cm³).' },        
        { type: 'text', heading: '3. Temperature', body: 'Measured in degrees Celsius (°C) using a thermometer. Example: Room temperature is ~25°C, boiling water is 100°C.' },        
        { type: 'text', heading: '4. Time', body: 'Measured in seconds (s), minutes (min), or hours (h) using a stopwatch or clock.' },        
        { type: 'text', heading: 'Tips for Accuracy', body: '1. Read measuring tools at eye level to avoid parallax error. <br><br> 2. Use the smallest unit of measurement possible for precision. <br><br> 3. Repeat measurements to check consistency.' },        
         ]
      },
      'solutions': {
        title: 'Lesson 4: Solutions (Quantitative Aspects and Solubility)',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Quantitatively express the amount of solute in a solvent. <br><br>2. Analyze how factors like heat affect solubility.' },        
        { type: 'text', heading: 'Quantitatively Expressing Solute Amount in a Solution', body: 'The amount of solute dissolved in a solvent can be described using concentration – a quantitative measure of how much solute is present per unit of solvent or solution.' },        
        { type: 'text', heading: 'Common Ways to Express Concentration <br><br> 1. Mass per volume', body: 'Grams of solute per liter (g/L) or grams per milliliter (g/mL) of solvent. <br><br> <b>• Formula:</b> Concentration (g/L) = Mass of solute (g) ÷ Volume of solvent (L) <br><br> <b>• Example:</b> If 20 grams of salt is dissolved in 0.5 liters of water, the concentration is 20 g ÷ 0.5 L = 40 g/L.' },        
        { type: 'text', heading: '2. Mass per mass', body: 'Grams of solute per 100 grams of solution (often called percent by mass). <br><br> <b>• Example:</b> A 10% salt solution means 10 grams of salt is dissolved in 90 grams of water, making 100 grams of solution.' },        
        { type: 'text', heading: 'Factors Affecting Solubility <br><br> For solid solutes in liquid solvents', body: 'Solubility increases with increasing temperature. This is because higher temperatures speed up solvent particles, allowing them to break apart more solute particles and hold more of them in solution. <br><br> <b>• Example:</b> 204 grams of sugar dissolves in 100 mL of water at 20°C, but 487 grams dissolves in the same amount of water at 100°C.' },        
        { type: 'text', heading: 'For gas solutes in liquid solvents', body: 'Solubility increases with increasing temperature. This is because higher temperatures speed up solvent particles, allowing them to break apart more solute particles and hold more of them in solution. <br><br> <b>• Example:</b> Soda goes flat faster when left out in the sun – higher temperature reduces the amount of carbon dioxide gas that can stay dissolved in the water.' },        
        { type: 'text', heading: 'Other Factors Affecting Solubility', body: '<b>Pressure:</b> Only affects gas solubility. Higher pressure forces more gas particles into the liquid, increasing solubility. Example: Soda is carbonated under high pressure to dissolve more CO₂. <br><br> <b>Stirring:</b> Does not increase solubility, but speeds up the rate at which solute dissolves by spreading solvent particles around the solute more quickly. <br><br> <b>Particle size:</b> Smaller solute particles dissolve faster than larger ones because they have more surface area exposed to the solvent. Example: Granulated sugar dissolves faster than sugar cubes.' },  
        ]
      }
    },
    4: {
      'use of models': {
        title: 'Lesson 1: Use of Models in Science',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Explain why models are essential tools in science.' },        
        { type: 'text', heading: 'Why Models Are Essential Tools in Science', body: 'Scientific models are more than just visual aids. They are foundational to how scientists understand, study, and communicate about the natural world. Their importance stems from three core functions:' },        
        { type: 'text', heading: '1. To Simplify Complex Ideas', body: 'Most natural phenomena involve countless variables and interactions that are impossible to study in their entirety. Models strip away non-essential details to focus on key relationships, making complexity manageable. <br><br> <b>Example:</b> The kinetic molecular model of gases ignores differences between individual gas molecules and assumes they are identical, hard spheres with no attractive forces. While this is not perfectly accurate, it simplifies calculations to explain gas behavior (e.g., how pressure changes with temperature). <br><br> <b>Why it matters:</b> Without simplification, scientists would be overwhelmed by data and unable to identify patterns.' },        
        { type: 'text', heading: '2. To Make Predictions', body: 'A strong model can forecast how a system will behave under new conditions, allowing scientists to plan experiments or prepare for real-world events. <br><br> <b>Example:</b> Climate models use mathematical equations to represent interactions between the atmosphere, oceans, land, and ice. They predict how global temperatures, precipitation, and sea levels will change under different greenhouse gas emission scenarios. <br><br> <b>Example:</b> Atomic orbital models predict where electrons are most likely to be found in an atom, helping chemists forecast how elements will react to form new compounds. <br><br><b>Why it matters:</b> Predictions let us test ideas before investing in large-scale research or taking action to address problems like climate change.' },        
        { type: 'text', heading: '3. To Test Theories', body: 'Models provide a way to simulate systems that are too large, small, dangerous, or slow to observe directly. Scientists can manipulate model variables to test whether a theory aligns with expected outcomes. <br><br> <b>Example:</b> Plate tectonic models use computer simulations to test how movements of Earth’s crust explain earthquakes, volcanoes, and continental drift. By adjusting parameters like plate speed or pressure, scientists verify if their theories about crustal behavior are correct. <br><br> <b>Example:</b> DNA replication models let scientists test how mutations might occur during copying by altering the model’s representation of base-pair bonding. <br><br> <b>Why it matters:</b> Models turn abstract theories into testable frameworks, driving scientific progress and refining our understanding of nature.' },        
        { type: 'text', heading: 'Key Note on Model Limitations', body: 'No model is perfect. All have boundaries to their usefulness. For example, the Bohr model of the atom works well for explaining hydrogen atoms but fails to describe more complex elements. As new evidence emerges, models are revised or replaced to improve their accuracy and scope.' },        
        ]
      },
      'the particle model': {
        title: 'Lesson 2: The Particle Model (Visualization and Interpretation)',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Create or interpret diagrams to describe the arrangement, spacing, and motion of particles in solids, liquids, and gases.' },        
        { type: 'text', heading: 'Creating and Interpreting Particle Diagrams', body: 'Particle diagrams use symbols (e.g., circles, spheres) to represent atoms or molecules, showing their arrangement, spacing, and motion. When creating or interpreting these diagrams, focus on three key features:' },        
        { type: 'text', heading: 'DIAGRAM 1: SOLID', body: '<b>Arrangement:</b> Particles are packed in a regular, repeating lattice pattern (e.g., cubes or hexagons). <br><br><b>Spacing:</b> Minimal space between particles. They touch or are very close together. <br><br><b>Motion:</b> Particles vibrate in fixed positions (represented by small arrows pointing back and forth). <br><br><b>Diagram Key:</b> Draw evenly spaced rows of circles with small vibration arrows. Label: "Solid – Fixed arrangement, minimal spacing, vibrating particles."' },        
        { type: 'text', heading: 'DIAGRAM 2: LIQUID', body: '<b>Arrangement:</b> Particles are randomly distributed with no regular pattern. <br><br><b>Spacing:</b> Close together, but with slightly more space than solids (some gaps between particles are visible). <br><br><b>Motion:</b> Particles slide past one another in random directions (represented by longer arrows pointing in different ways). <br><br><b>Diagram Key:</b> Draw circles clustered together but not in rows, with arrows showing sliding movement. Label: "Liquid – Random arrangement, moderate spacing, sliding particles."' },        
        { type: 'text', heading: 'DIAGRAM 3: GAS', body: '<b>Arrangement:</b> Particles are widely scattered with no pattern. <br><br><b>Spacing:</b> Large gaps between particles. Much greater than the size of the particles themselves. <br><br><b>Motion:</b> Particles move rapidly in all directions (represented by long arrows pointing outward, with some collision symbols). <br><br><b>Diagram Key:</b> Draw a few circles spread far apart across the space, with long arrows and small "x" marks to show collisions. Label: "Gas – No fixed arrangement, large spacing, fast-moving colliding particles."' },        
        ]
      },
      'changes of state': {
        title: 'Lesson 3: Changes of State',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Explain in detail how changes of state occur for all three states in terms of particle arrangement and energy changes.' },        
        { type: 'text', heading: 'Shifts in Particle Energy, Arrangement, and Interparticle Forces', body: 'All changes of state involve shifts in particle energy, arrangement, and interparticle forces. Below is a comprehensive breakdown:' },         
        { type: 'text', heading: '1. Melting (Solid to Liquid)', body: '<b>Energy change:</b> Endothermic – heat is absorbed from the surroundings. This energy is used to overcome the strong attractive forces holding particles in the solid lattice, rather than increasing temperature (the latent heat of fusion). <br><br><b>Particle behavior:</b> <br>Solid phase: Particles vibrate in fixed positions, held by strong forces. <br><br>As heat is added, vibration speed increases until forces are weakened enough for particles to break free from their lattice. <br><br> Liquid phase: Particles are still close together but can slide past one another, with weaker attractive forces than solids.<br><br><b>Example:</b> Ice melting at 0°C – temperature remains constant until all ice turns to water.' },        
        { type: 'text', heading: '2. Freezing (Liquid to Solid)', body: '<b>Energy change:</b> Exothermic – heat is released to the surroundings (latent heat of fusion is given off). <br><br><b>Particle behavior:</b> Liquid phase: Particles slide past one another with moderate energy. <br><br> As heat is removed, particle motion slows, and attractive forces strengthen. <br<br> Solid phase: Particles lock into a regular lattice, with strong forces holding them in place. <br><br><b>Example:</b> Water freezing into ice – temperature stays at 0°C until all liquid becomes solid.' },        
        { type: 'text', heading: '3. Evaporation/Boiling (Liquid to Gas)', body: '<b>Energy change:</b> Endothermic – heat is absorbed (latent heat of vaporization). <br><br><b>• Evaporation:</b> Occurs at the surface; only high-energy particles escape, leaving lower-energy particles behind (which is why evaporating liquids cool down). <br><br><b>• Boiling: </b> Occurs throughout the liquid at the boiling point; all particles gain enough energy to break free. <br><br><b>Particle behavior:</b> <br><br>Liquid phase: Particles are close together with moderate attractive forces. <br><br> As heat is added, motion speeds up until forces are completely overcome. <br><br> Gas phase: Particles are far apart, moving rapidly and colliding with no significant attractive forces between them. <br><br><b>Example:</b> Water boiling at 100°C at sea level. Pressure affects boiling point (lower pressure = lower boiling point).' },        
        { type: 'text', heading: '4. Condensation (Gas to Liquid)', body: '<b>Energy change:</b> Exothermic – heat is released (latent heat of vaporization is given off). <br><br><b>Particle behavior:</b> <br> Gas phase: Particles move rapidly with high energy, far apart from one another. <br><br> As heat is removed, motion slows, and particles move closer together. Weak attractive forces begin to act, pulling particles into clusters.<br><br> Liquid phase: Particles are close together, sliding past one another with moderate forces.<br><br><b>Example:</b> Water vapor condensing into dew on grass overnight. The air cools, causing vapor particles to clump into liquid droplets.' },        
        { type: 'text', heading: '5. Sublimation (Solid to Gas)', body: '<b>Energy change:</b> Endothermic – heat is absorbed (latent heat of sublimation). <br><br><b>Particle behavior:</b> <br> Solid phase: Particles vibrate in fixed positions with strong forces.<br><br> Instead of melting first, particles gain enough energy to directly overcome all attractive forces and move into the gas phase. <br><br> Gas phase: Particles are far apart, moving rapidly.<br><br><b>Example:</b> Dry ice (solid CO₂) sublimating into CO₂ gas at room temperature – no liquid CO₂ forms at standard pressure.' },        
        { type: 'text', heading: '6. Deposition (Gas to Solid)', body: '<b>Energy change:</b> Exothermic – heat is released (latent heat of sublimation is given off).<br><br><b>Particle behavior:</b> <br> Gas phase: Particles move rapidly with high energy. <br><br> Instead of condensing first, particles lose enough energy to directly form strong attractive forces and lock into a solid lattice. <br><br>Solid phase: Particles are in a fixed, regular arrangement. <br><br><b>Example:</b> Frost forming on a cold window – water vapor in air deposits directly as ice crystals without becoming liquid.' },        
      ]
      },
    'scientific investigations': {
        title: 'Lesson 4: Scientific Investigations',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Follow a complete scientific investigation process, including defining aim, listing materials, outlining step-by-step methods, recording results, and drawing conclusions. <br><br>2. Organize collected data using tables, charts, or graphs.' },        
        { type: 'text', heading: 'Sample Complete Investigation: How Does Particle Size Affect Dissolution Rate? <br><br> AIM', body: 'To determine how the particle size of a solute (sugar) affects the time it takes to dissolve in a fixed amount of water at room temperature.' },              
        { type: 'text', heading: 'MATERIALS', body: '• 3 types of sugar: sugar cubes, granulated sugar, powdered sugar (all 10 grams per sample) <br>• 3 identical beakers​ <br>• 300 mL distilled water (100 mL per beaker) <br>• Thermometer (to confirm room temperature ~25°C) <br>• Stopwatch <br>• Stirring rod (stirring speed kept constant for all samples) <br>• Balance scale (to measure sugar mass) <br>• Data table and graph paper/software' },        
        { type: 'text', heading: 'STEP-BY-STEP METHOD', body: '1. Use the balance scale to measure 10 grams of sugar cubes, granulated sugar, and powdered sugar. Place each in a separate labeled container. <br><br> 2. Pour 100 mL of distilled water into each beaker. Use the thermometer to check that all water samples are 25°C. <br><br> 3. Test 1 (Sugar Cubes): Add the 10 grams of sugar cubes to Beaker 1. Start the stopwatch immediately. Stir gently and consistently (10 stirs per minute) until no sugar is visible. Stop the stopwatch and record the time. <br><br> 4. Test 2 (Granulated Sugar): Repeat Step 3 with Beaker 2 and granulated sugar, using the same stirring speed and timing method.  <br><br> 5. Test 3 (Powdered Sugar): Repeat Step 3 with Beaker 3 and powdered sugar. <br><br> 6. Conduct 3 trials for each sample to ensure reliability. <br><br> 7. Record all results in a data table.' },        
        { type: 'image', url: 'https://imgur.com/kJhKCTZ.jpg', caption: 'DATA TABLE: DISSOLUTION TIME BY PARTICLE SIZE' },
        { type: 'text', heading: 'ANALYSIS', body: 'The data shows a clear trend: as particle size decreases, average dissolution time decreases significantly. Sugar cubes (largest particles) took the longest to dissolve (182 seconds), while powdered sugar (smallest particles) took the shortest (11 seconds). This is because smaller particles have more surface area exposed to the water, allowing solvent particles to break down solute particles faster.' },        
        { type: 'text', heading: 'CONCLUSON', body: 'The investigation supports the hypothesis that smaller solute particle size increases dissolution rate. To improve accuracy, future tests could control humidity levels and use a mechanical stirrer to ensure perfectly consistent stirring speed. A new question to explore: Does particle size have the same effect on solubility (maximum amount dissolved) as it does on dissolution rate?' },        
        ]
      },
      'solutions': {
        title: 'Lesson 5: Solutions',
        modules: [
        { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Demonstrate through practical activities how factors like temperature, particle size, and stirring affect solubility. <br><br> 2. Identify common solutions at home and school and test their reaction with litmus paper to determine if they are acidic or basic.' },        
        { type: 'text', heading: 'PRACTICAL ACTIVITY 1: FACTORS AFFECTING SOLUBILITY', body: '<b>Goal:</b> Demonstrate how temperature, particle size, and stirring affect solubility and dissolution rate.' },        
        { type: 'text', heading: 'Materials Needed', body: 'Sugar, salt, water (cold and hot) <br>• Sugar cubes, powdered sugar <br>• Beakers, graduated cylinders, stopwatch, thermometer <br>• Stirring rods' },        
        { type: 'text', heading: 'Activity Steps <br><br> 1. Temperature Effect:', body: '• Dissolve sugar in 100 mL cold water (25°C) until no more dissolves (saturated solution). Record the mass of sugar used. <br><br> •Repeat with 100 mL hot water (80°C). Compare the masses – more sugar dissolves in hot water, showing higher solubility at higher temperatures.' },        
        { type: 'text', heading: '2. Particle Size Effect:', body: '•Add 10 grams of sugar cubes to 100 mL room-temperature water; time how long it takes to dissolve without stirring. <br><br>• Repeat with 10 grams of powdered sugar. Observe that powdered sugar dissolves faster, even though solubility is the same.' },        
        { type: 'text', heading: '3. Stirring Effect:', body: '• Add 10 grams of granulated sugar to two beakers of 100 mL room-temperature water. <br><br>• Stir one beaker gently; leave the other unstirred. Record times - stirring speeds up dissolution but does not change how much sugar dissolves.' },        
        { type: 'text', heading: 'PRACTICAL ACTIVITY 2: ACID-BASE TESTING OF COMMON SOLUTIONS', body: '<b>Goal:</b> Identify acidic, basic, or neutral solutions using litmus paper.' },        
        { type: 'text', heading: 'Background', body: 'Litmus Paper: A natural indicator that changes color based on pH: <br>• Blue litmus paper turns red in acidic solutions (pH < 7). <br>• Red litmus paper turns blue in basic solutions (pH > 7). <br>• No color change in neutral solutions (pH = 7).' },        
        { type: 'text', heading: 'Materials needed', body: '• Red and blue litmus paper strips <br>• Common solutions (labeled A to F): <br>1. Vinegar (home) <br>2. Baking soda solution (home) <br>3. Tap water (home/school) <br>4. Lemon juice (home) <br>5. Soap solution (home) <br> 6. Distilled water (school) <br> •Droppers, test tubes or small cups' },        
        { type: 'text', heading: 'Activity steps', body: '1. Label test tubes/cups with the solution names. <br><br>2. For each solution: <br> • Place 2 mL in a test tube/cup. <br> • Dip one blue litmus strip and one red litmus strip into the solution. <br> • Record color changes and classify the solution as acidic, basic, or neutral.' },        
        { type: 'text', heading: 'Discussion', body: 'Many common household solutions are acidic or basic: acidic solutions often taste sour (e.g., vinegar, lemon juice), while basic solutions feel slippery (e.g., soap, baking soda). Neutral solutions like distilled water have a balanced pH.' },        
        ]
      }
    },
    5: {
      'the particle model': {
        title: 'Lesson 1: The Particle Model - Application to Real-World Phenomena',
        modules: [
        { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Apply the Particle Model of Matter to explain a wide range of phenomena.' },        
        { type: 'text', heading: 'The Particle Model of Matter: Explaining How Substances Behave', body: 'The Particle Model of Matter is a powerful framework that can explain diverse observations about how substances behave. Below is how it applies to key phenomena:' },        
        { type: 'text', heading: '1. Why Substances Expand When Heated', body: '<b>Explanation:</b> Temperature is a measure of particle kinetic energy. When heat is added, particles move faster and gain energy to overcome some of the attractive forces between them. This causes particles to spread further apart, increasing the total volume of the substance – a process called thermal expansion. <br><br> <b>Phenomena Examples:</b> <br>• Solids: Metal railway tracks have gaps between sections to allow for expansion in hot weather; if not, tracks would buckle as particles spread apart. <br><br>• Liquids: Thermometers work because liquid mercury or alcohol expands up a narrow tube when heated. Faster-moving particles take up more space. <br><br>• Gases: A balloon inflates when left in the sun because gas particles inside move faster, collide more forcefully with the balloon walls, and spread apart to increase volume. <br><br><b>Exception:</b> Water expands when freezing (from liquid to solid) because ice forms a lattice structure with more space between particles than liquid water. This is why ice floats on water.' },        
        { type: 'text', heading: '2. Why Some Substances Mix While Others Do Not', body: '<b>Explanation:</b> Mixing (or miscibility) depends on the nature of particles and their attractive forces. Particles of similar types tend to mix because their intermolecular forces are compatible, like dissolves like. <br><br> <b>• Polar vs. Nonpolar Particles:</b> Polar particles (e.g., water molecules, which have uneven charge distribution) attract other polar particles and repel nonpolar ones. Nonpolar particles (e.g., oil molecules, with even charge distribution) attract other nonpolar particles. <br><br> <b>Phenomena Examples:</b> <br><b>• Mixing:</b> Salt (polar ions) dissolves in water (polar) because water molecules surround and pull apart salt particles. Ethanol (polar) mixes completely with water. <br><br><b>• Not Mixing:</b> Oil (nonpolar) does not mix with water (polar) – their particles repel each other, so oil floats on top as separate layers. Sand does not dissolve in water because its solid particles have strong attractive forces that water cannot overcome.' },        
        { type: 'text', heading: '3. Why Gases Can Be Compressed (But Solids/Liquids Cannot)', body: '<b>Explanation:</b> Compression reduces the volume of a substance by forcing particles closer together. <br><br> <b>• Gases:</b> Particles are far apart with large empty spaces between them. Applying pressure pushes particles closer, significantly reducing volume. <br><br><b>• Solids/Liquids:</b> Particles are already very close together with minimal empty space. Even high pressure cannot force them much closer, so these states are nearly incompressible. <br><br> <b>Phenomena Examples:</b><br>• Scuba tanks hold large amounts of compressed air because gas particles are squeezed into a small volume. <br><br>• Hydraulic brakes use liquid oil because it cannot be compressed. Pressure applied to one end is transmitted fully to the other end to stop a vehicle. <br><br>• A wooden block cannot be squashed smaller because its particles have no space to move closer.' },        
        ]
      },
      'scientific investigations': {
        title: 'Lesson 2: Scientific Investigations - Design and Independent Conduct',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Design and conduct scientific investigations independently, including formulating hypotheses and selecting appropriate materials and methods.' },        
        { type: 'text', heading: 'Key Steps for Independent Investigation Design <br><br> 1. Identify a Research Question', body: 'Choose a question that is testable, specific, and relevant to a scientific concept. <br><br> • Good example: How does temperature affect the solubility limit of table salt in water? <br><br> • Poor example: Why is salt soluble in water? (too broad and not testable quantitatively)' },        
        { type: 'text', heading: '2. Formulate a Hypothesis', body: 'Write a clear, predictive statement with a rationale, based on prior knowledge. <br><br> • Example: If water temperature increases, then the solubility limit of table salt will increase slightly because higher temperatures provide more energy to overcome attractive forces between salt ions, allowing more salt to dissolve.' },        
        { type: 'text', heading: '3. Select Variables', body: '<b>Independent Variable:</b> The factor you change (e.g., water temperature: 10°C, 30°C, 50°C, 70°C, 90°C). <br><br><b>• Dependent Variable:</b> The factor you measure (e.g., mass of salt needed to make a saturated solution in 100 mL water). <br><br><b>• Controlled Variables:</b> Factors kept constant (e.g., volume of water, type of salt, stirring method, time allowed for dissolving).' },        
        { type: 'text', heading: '4. Choose Materials & Equipment', body: 'Select appropriate tools that ensure accuracy and safety. List all items with specifications (e.g., analytical balance scale - measures to 0.01 grams).' },        
        { type: 'text', heading: '5. Outline a Safe, Step-by-Step Method', body: '• Include safety procedures (e.g., wearing goggles, using heat-resistant gloves when handling hot water). <br><br>• Specify how variables are controlled and how data will be collected. <br><br>• Plan for multiple trials (at least 3) to ensure results are reliable.' },        
        { type: 'text', heading: '6. Design Data Recording Tools', body: 'Create tables, charts, or digital spreadsheets to organize observations and measurements.' },        
        { type: 'text', heading: '7. Plan Data Analysis', body: 'Decide how you will process data (e.g., calculate averages, create graphs) and what statistical tests (if any) you will use.' },        
        { type: 'text', heading: 'Sample Independent Investigation: Design to Determine How Temperature Affects Salt Solubility <br><br> RESEARCH QUESTION', body: 'What is the relationship between water temperature and the solubility limit of sodium chloride (table salt) in 100 mL of distilled water?' },        
        { type: 'text', heading: 'HYPOTHESIS', body: 'As water temperature increases from 10°C to 90°C, the solubility limit of sodium chloride will increase gradually, because higher kinetic energy of water molecules allows them to break apart and stabilize more salt ions in solution.' },        
        { type: 'text', heading: 'MATERIALS AND EQUIPMENT', body: '• Sodium chloride (table salt, pure grade) <br>• Distilled water <br>• 5 beakers (250 mL, heat-resistant) <br>• Analytical balance scale (0.01 g precision) <br>• Thermometer (digital, -10°C to 110°C) <br>• Hot plate with temperature control <br>• Ice bath (for cooling water to 10°C) <br>• Stirring rods (glass, heat-resistant)  <br>• Filter paper and funnels (to remove undissolved salt) <br>• Drying oven (to measure mass of undissolved salt) <br>• Safety equipment: Lab coat, safety goggles, heat-resistant gloves, fire extinguisher' },        
        { type: 'text', heading: 'SAFETY PROCEDURES', body: '• Wear all safety gear at all times. <br>• Use the hot plate on a stable surface; keep flammable materials away. <br>• Handle hot beakers with gloves; allow solutions to cool before filtering. <br>• Clean up spills immediately to prevent slips.' },        
        { type: 'text', heading: 'STEP-BY-STEP METHOD', body: '1. Prepare 5 water samples of 100 mL each, adjusted to the target temperatures: <br>• 10°C: Place beaker in ice bath and monitor with thermometer. <br><br>• 30°C, 50°C, 70°C, 90°C: Heat water on hot plate and adjust to target temperature. <br><br> 2. For each temperature: <br>a. Add water to a labeled beaker and confirm temperature with the thermometer. <br><br>b. Slowly add salt to the water in small increments (0.5 g at a time), stirring continuously until no more salt dissolves (solution is saturated). <br><br>c. Once no more salt dissolves, let the solution settle for 5 minutes.<br><br>d. Filter the undissolved salt using pre-weighed filter paper; dry the filter paper and salt in the oven at 105°C for 1 hour. <br><br>e. Weigh the dried filter paper and salt to calculate the mass of undissolved salt. <br><br>f. Calculate dissolved salt mass: Total salt added – undissolved salt mass. <br><br>3. Repeat steps 2a–2f three times for each temperature to collect replicate data. <br><br>4. Record all measurements in a data table.' },        
        { type: 'text', heading: 'DATA RECORDING TABLE', body: 'This is a data table designed to record measurements related to salt solubility at a constant temperature of 10°C. It includes columns for temperature, trial number, total salt added, mass of undissolved salt, mass of dissolved salt, and average dissolved salt mass. Currently, no numerical data has been entered in the rows corresponding to the three trials.' },        
        { type: 'image', url: 'https://imgur.com/04cpO9s.jpg', caption: '' },
        { type: 'text', heading: 'DATA ANALYSIS PLAN', body: '• Calculate average solubility limit for each temperature. <br> • Create a line graph with temperature on the x-axis and average solubility on the y-axis. <br> • Analyze the trend line to determine if the hypothesis is supported.' },        
        { type: 'text', heading: 'CONCLUSION FRAMEWORK', body: '• State whether the hypothesis was supported or rejected. <br> • Explain results using the Particle Model. <br> • Discuss sources of error (e.g., slight temperature fluctuations, incomplete drying of salt) and suggest improvements.​ <br> • Link findings to real-world applications (e.g., how salt dissolves in ocean water at different depths/temperatures).' },        
        ]
      },
      'solutions': {
        title: 'Lesson 3: Solutions - Analysis and Real-World Applications',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Analyze the properties of different solutions, including solubility limits and litmus reactions, and explain the reasons behind these properties. <br><br>2. Apply knowledge of solutions to real-world tasks, such as determining the amount of salt present in a sample of seawater through practical investigation.' },        
        { type: 'text', heading: 'ANALYZING SOLUTION PROPERTIES', body: 'Expert learners go beyond observing properties to explaining their causes, using knowledge of particles, forces, and energy.' },        
        { type: 'text', heading: '1. Solubility Limits', body: '<b>What it is:</b> The maximum amount of solute that can dissolve in a given amount of solvent at a specific temperature and pressure.<br><br<b>Explanation:</b> Solubility limits depend on:<br><b>• Intermolecular forces:</b> Stronger attraction between solute and solvent particles increases solubility. For example, ethanol (C₂H₅OH) is highly soluble in water because both have polar molecules that form hydrogen bonds. <br><br><b>• Temperature:</b> As covered earlier, solids generally become more soluble with heat; gases become less soluble. <br><br><b>• Pressure:</b> Only affects gases – higher pressure forces more gas particles into solution (e.g., carbonation in soda).<br><br><b>• Analysis Example:</b> If 36.0 g of salt dissolves in 100 mL water at 20°C, but only 35.7 g dissolves at 10°C, the small change shows salt solubility is only slightly temperature-dependent (unlike sugar, which has a much higher solubility increase with heat).' },        
        { type: 'text', heading: '2. Litmus Reactions and Acid-Base Properties', body: '<b>What it is:</b> Litmus paper indicates whether a solution is acidic (pH < 7), basic (pH > 7), or neutral (pH = 7) by changing color due to chemical reactions with hydrogen ions (H⁺) or hydroxide ions (OH⁻). <br><br<b>Explanation:</b> <br><b>Acidic solutions:</b> Contain more H⁺ ions (e.g., vinegar = acetic acid, lemon juice = citric acid). Blue litmus turns red because H⁺ ions react with litmus dye to change its structure and color. <br><br><b>• Basic solutions:</b> Contain more OH⁻ ions (e.g., baking soda = sodium bicarbonate, soap = sodium hydroxide). Red litmus turns blue because OH⁻ ions react with litmus dye. <br><br><b>• Neutral Solutons:</b> Have equal numbers of H⁺ and OH⁻ ions (e.g., distilled water, table salt solution). No color change occurs because there is no excess of either ion to react with the dye. <br><br><b>Analysis Example:</b> A solution of lemon juice turns blue litmus red but has no effect on red litmus – this means it is acidic, as citric acid molecules release H⁺ ions when dissolved in water.' },        
        { type: 'text', heading: 'REAL-WORLD APPLICATION: DETERMINING SALT CONTENT IN SEAWATER', body: 'Seawater contains dissolved salts (mostly sodium chloride). Learners can design a practical method to measure the salt concentration in a sample.' },        
        { type: 'text', heading: 'INVESTIGATION AIM', body: 'To determine the mass of salt present in a 100 mL sample of seawater.' },        
        { type: 'text', heading: 'PRINCIPLE', body: 'When seawater is evaporated, the water turns to vapor and leaves behind solid salt, which can be weighed to calculate concentration.' },        
        { type: 'text', heading: 'MATERIALS AND EQUIPMENT', body: '• 100 mL seawater sample <br>• Evaporating dish (pre-weighed) <br>• Analytical balance scale <br>• Hot plate or Bunsen burner (with tripod and wire gauze) <br>• Safety goggles, lab coat, heat-resistant gloves <br>• Desiccator (to cool dried salt without absorbing moisture)' },        
        { type: 'text', heading: 'SAFE METHOD', body: '1. Weigh the clean, dry evaporating dish using the balance scale; record the mass (M₁).<br><br>2. Pour exactly 100 mL of seawater into the evaporating dish. <br><br>3. Place the dish on the hot plate (low to medium heat) to evaporate the water slowly. Do not boil vigorously to avoid splashing salt out. <br><br>4. Once all water has evaporated (dish appears dry), turn off the heat and transfer the dish to the desiccator to cool completely. <br><br>5. Weigh the dish with dried salt; record the mass (M₂). <br><br>6. Calculate salt mass: M₂ – M₁. <br><br>7. Repeat with 3 samples to ensure accuracy.' },

  function renderLesson(lesson) {
  let html = `<div class="lesson-pkg border-l-4 border-blue-500 pl-4 py-4 mb-6 bg-gray-900/30 rounded-r-lg">
                <h2 class="text-2xl font-black text-blue-400 mb-4 tracking-tight uppercase">${lesson.title}</h2>`;

  lesson.modules.forEach(mod => {
    if (mod.type === 'text') {
      // Clean quotes and backticks to prevent JS errors
      const safeHeading = mod.heading.replace(/'/g, "\\'").replace(/`/g, "\\`自");
      const safeBody = mod.body.replace(/'/g, "\\'").replace(/`/g, "\\`自");

      // Removed mb-6 and added mb-2 for tighter spacing
      // The 🔊 icon is now separate from the text being sent to speakText()
      html += `
        <div class="mb-2 cursor-pointer p-1 hover:bg-blue-900/10 rounded transition-all" 
             onclick="speakText('${safeHeading}. ${safeBody}')">
           <h4 class="text-md font-bold text-blue-100 flex items-center gap-2">
             ${mod.heading} <span class="text-xs opacity-40">🔊</span>
           </h4>
           <p class="text-gray-300 leading-relaxed text-sm">${mod.body}</p>
        </div>`;
    }
    else if (mod.type === 'image') {
      html += `<div class="my-6 group">
                 <img src="${mod.url}" class="rounded-lg border border-blue-900/50 w-full hover:scale-[1.01] transition-transform duration-300">
                 <p class="text-xs italic text-gray-500 mt-2 text-center">${mod.caption}</p>
               </div>`;
    }
    else if (mod.type === 'image') {
      // Imgur Handling: Ensure links to Imgur pages are treated as direct images
      let imageUrl = mod.url;
      if (imageUrl.includes('imgur.com') && !imageUrl.match(/\.(jpg|jpeg|png|gif|webp)$/)) {
          imageUrl += '.jpg'; // Appending extension often forces Imgur to serve the raw image
      }

      html += `<div class="my-4 text-center">
                 <img src="${imageUrl}" alt="${mod.caption || 'Lesson Image'}" class="rounded border border-gray-700 w-full mb-1">
                 <span class="text-xs italic text-gray-500">${mod.caption || ''}</span>
               </div>`;
    } 
    else if (mod.type === 'video') {
      let mediaUrl = mod.url;
      let embedHtml = '';

      // --- Vimeo URL Auto-Fix ---
      if (mediaUrl.includes('vimeo.com')) {
        const vimeoId = mediaUrl.split('/').pop().split('?')[0];
        const embedUrl = `https://player.vimeo.com/video/${vimeoId}`;
        embedHtml = `<iframe src="${embedUrl}" width="100%" height="100%" frameborder="0" allow="autoplay; fullscreen" allowfullscreen class="rounded shadow-lg"></iframe>`;
      }
      
      // --- Google Drive URL Auto-Fix ---
      else if (mediaUrl.includes('drive.google.com')) {
        // Extract ID from /file/d/[ID]/view or id=[ID]
        const driveId = mediaUrl.match(/\/d\/(.+?)\//) ? mediaUrl.match(/\/d\/(.+?)\//)[1] : mediaUrl.split('id=')[1];
        const embedUrl = `https://drive.google.com/file/d/${driveId}/preview`;
        embedHtml = `<iframe src="${embedUrl}" width="100%" height="100%" frameborder="0" allow="autoplay" class="rounded shadow-lg"></iframe>`;
      }

      // --- Imgur Video/Gifv Handling ---
      else if (mediaUrl.includes('imgur.com')) {
        // Convert .gifv or page links to direct .mp4 for the HTML5 player
        const directVideo = mediaUrl.replace('.gifv', '.mp4');
        embedHtml = `<video controls class="w-full h-full rounded shadow-lg bg-black">
                       <source src="${directVideo}" type="video/mp4">
                       Your browser does not support the video tag.
                     </video>`;
      }

      html += `<div class="my-4 aspect-video">
                 ${embedHtml}
                 <p class="text-xs text-gray-500 mt-1">${mod.title || ''}</p>
               </div>`;
    }
  });
  return html + `</div>`;
}

   async function callGemini(finalPrompt) {
  try {
    const API_URL = "https://gemini3.rusky0537.workers.dev"; 

    const res = await fetch(API_URL, { 
      method: 'POST', 
      headers: { 'Content-Type': 'application/json' }, 
      body: JSON.stringify({ 
        prompt: finalPrompt  // Sending the pre-built prompt from getAIResponse
      })
    });
    
    const textResponse = await res.text();
    let data;
    try {
        data = JSON.parse(textResponse);
    } catch (e) {
        return "⚠️ Error: The server sent a non-JSON response. Check Worker logs.";
    }

    if (data.error) {
        if (data.error.toLowerCase().includes("quota")) return "⚠️ Quota Reached. Please wait 60 seconds.";
        return `⚠️ Error: ${data.error}`;
    }
    
    let reply = data.response || '⚠️ No response received.';
    
    // Clean formatting for the chat UI
    return reply
      .replace(/```(?:html|json|markdown)?\n?/gi, '')
      .replace(/```$/g, '')
      .replace(/\\n/g, '\n') 
      .replace(/\*\*/g, '') 
      .trim();

  } catch (e) { 
    console.error(e);
    return '⚠️ Connectivity issue. Ensure your Worker is deployed and CORS is enabled.'; 
  }
}

async function getAIResponse(userInput) {
  let finalPrompt;

  if (mode === "skill") {

  else if (mode === "descriptor") {
    finalPrompt = buildDescriptorPrompt(userInput);

  else {
    finalPrompt = `You are a concise AI assistant. Answer directly in 2–3 sentences.\n\nUser Question:\n${userInput}`;
  }

  // Pass the built prompt to the callGemini function
  return await callGemini(finalPrompt);

    const subtopicTitle = topics.find(t => t.id === selectedTopic)?.subtopics.find(s => s.id === selectedSubtopic)?.title || 'Selected Branch';
    const skillLabel = skillLevels.find(s => s.level === level)?.label || `Level ${level}`;
    const quizKey = `${subtopicId}_${level}`;

    if (!answeredStaticQuestions[quizKey]) answeredStaticQuestions[quizKey] = new Set();
    const answeredIndices = answeredStaticQuestions[quizKey];
    if (!aiGeneratedQuestions[quizKey]) aiGeneratedQuestions[quizKey] = new Set();

    // --- STATE: AWAITING_RANGE ---
    if (skillQuizState === 'AWAITING_RANGE') {
        const match = text.match(/(\d+)\s*-\s*(\d+)/);
        if (!match) return addMessage('bot', `Please type a question range (e.g., 1-5).`);

        const start = parseInt(match[1]);
        const end = parseInt(match[2]);
        const totalCount = end - start + 1;
        if (totalCount < 1 || totalCount > 20) return addMessage('bot', 'Range must be between 1-20 questions.');

        loadedQuestionSet = [];
        currentQuestionIndex = 0;
        skillQuizState = 'AWAITING_ANSWERS';
        currentRange = { start, end, loaded: 0, total: totalCount };
        await loadNextQuestion();
    }

    // --- STATE: AWAITING_ANSWERS (The "Gemini Checker" Section) ---
    else if (skillQuizState === 'AWAITING_ANSWERS') {
        const currentQuestion = loadedQuestionSet[currentQuestionIndex];
        const userAnswer = text.trim();
        const loadingMessage = addMessage('bot', 'Analyzing your answer...');

        if (!currentQuestion) {
            if(loadingMessage) loadingMessage.remove();
            return addMessage('bot', 'Quiz error. Please start over.');
        }

        // 1. Logic for "Reveal Answer"
        if (userAnswer.toLowerCase().includes('reveal answer')) {
            loadingMessage.remove();
            try {
                if (currentQuestion.a === 'Awaiting Gemini Check') {
                    currentQuestion.a = await callGemini(`Provide a concise, accurate answer for: "${currentQuestion.q}"`) || 'Answer unavailable';
                }
                addMessage('bot', `The correct answer is: **${currentQuestion.a}**`);
                if (currentQuestion.originalIndex) answeredIndices.add(currentQuestion.originalIndex);
            } catch(e) {
                addMessage('bot', 'Could not generate answer.');
            }
            currentQuestionIndex++;
            await loadNextQuestion();
            return;
        } 
        
        // 2. Logic for Conceptual Critique
        else {
            try {
                if (currentQuestion.a === 'Awaiting Gemini Check') {
                    currentQuestion.a = await callGemini(`Provide a concise answer for: "${currentQuestion.q}"`) || 'Answer unavailable';
                }

                // Instructions to make Gemini a Critique Partner
                const gradingContext = `
                    You are Gemini, a supportive AI teacher for Levels 1-3. 
                    Question: "${currentQuestion.q}"
                    Correct Answer: "${currentQuestion.a}"
                    Student Answer: "${userAnswer}"

                    Instructions:
                    1. If the answer is CONCEPTUALLY correct (don't worry about exact words), start with "✅ Correct!" and explain why.
                    2. If wrong, explain why it's incorrect and give a helpful CLUE. Do NOT reveal the correct answer.
                `;

                const feedback = await callGemini(gradingContext);
                loadingMessage.remove();
                addMessage('bot', feedback);

                if (feedback.toLowerCase().includes('correct')) {
                    if (currentQuestion.originalIndex) answeredIndices.add(currentQuestion.originalIndex);
                    currentQuestionIndex++;
                    // Delay slightly so student can read the explanation
                    setTimeout(async () => {
                        await loadNextQuestion();
                    }, 1500);
                } else {
                    // WRONG: Stay on the same question, show a hint
                    addMessage('bot', "💡 Use the clue above and try again!");
                }
            } catch(e) {
                if(loadingMessage) loadingMessage.remove();
                addMessage('bot', 'Error checking answer. Try again.');
            }
        }
    }

    // --- STATE: AWAITING_NEXT_SET ---
    else if (skillQuizState === 'AWAITING_NEXT_SET') {
        const cmd = text.toLowerCase().trim();
        if (cmd === 'next') {
            skillQuizState = 'AWAITING_RANGE';
            addMessage('bot', 'Please provide the range for the next set.');
        } else if (cmd === 'review') {
            loadedQuestionSet.forEach((q, i) => {
                addMessage('bot', `Q${i+1}: ${q.q} | Answer: ${q.a !== 'Awaiting Gemini Check' ? q.a : 'Not available'}`);
            });
            addMessage('bot', 'Review complete. Type "next" for another set.');
        }
    }
}

async function checkAnswerWithGemini(userAnswer, correctAnswer, questionText) {
  const prompt = `
    You are an AI Learning Assistant. A student is answering a question.
    Question: "${questionText}"
    Expected Answer: "${correctAnswer}"
    Student's Answer: "${userAnswer}"

    Rules:
    1. If the student's answer is conceptually correct (even if the wording is slightly different), start your response with "CORRECT:". Then explain why.
    2. If it is wrong, start your response with "CLUE:". Explain why it's wrong (without giving the answer) and provide a helpful hint to guide them.
    3. Be encouraging and supportive.
  `;

  // Uses your existing callGemini logic
  const response = await callGemini(prompt, "skill-critique");
  return response || "CLUE: I'm having trouble checking that. Try explaining your answer again.";
}
  


// --- Helper: Load next question sequentially ---
async function loadNextQuestion() {
    if (!currentRange) return;

    // Check if we finished all requested questions
    if (currentRange.loaded >= currentRange.total) {
        skillQuizState = 'AWAITING_NEXT_SET';
        addMessage('bot', '✅ **Set Complete!** Type "next" for another set or "review" to see answers.');
        return;
    }

    let nextQuestion;
    const startIndex = currentRange.start - 1 + currentRange.loaded;
    const qIndex = startIndex + 1;

    // Try static question first
    if (lessonContent.skill[currentInteraction.subtopic]?.[currentInteraction.level]?.questions?.[startIndex] && 
        !answeredStaticQuestions[`${currentInteraction.subtopic}_${currentInteraction.level}`].has(qIndex)) {
        nextQuestion = {
            ...lessonContent.skill[currentInteraction.subtopic][currentInteraction.level].questions[startIndex],
            originalIndex: qIndex
        };
    } else {
        // Generate AI question
        let attempts = 0;
        while (!nextQuestion && attempts < 5) {
            attempts++;
            try {
    const result = await callGemini(
        `Generate 1 short science question for ${subtopicTitle} at ${skillLabel}.`, 
        "skill-generator"
    );
    const questionText = result.split('?')[0] + '?'; // Ensure it ends at the question mark
    
    if (!aiGeneratedQuestions[quizKey].has(questionText)) {
        aiGeneratedQuestions[quizKey].add(questionText);
        nextQuestion = { q: questionText, a: 'Awaiting Gemini Check' };
    }
} catch (e) {
    // High-performance fallback: A standard curriculum question
    nextQuestion = { q: "Identify a primary factor affecting this system.", a: "Awaiting Gemini Check" };
}
        }
    }

    if (!nextQuestion) return addMessage('bot', 'Could not generate next question.');

    loadedQuestionSet.push(nextQuestion);
    currentQuestionIndex = loadedQuestionSet.length - 1;
    currentRange.loaded++;

    addMessage('bot', `**Q${loadedQuestionSet.length}:** ${nextQuestion.q}`);
}

            addMessage('bot', 'Error connecting to the AI guide.');

}
     
  


   function handleSendMessage() {
  const input = document.getElementById('chat-input');
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;

  addMessage('user', val);
  input.value = '';

  const lowerVal = val.toLowerCase();
  
  // Navigation Resets
  if (lowerVal.includes('start over')) {
    addMessage('bot', 'Restarting...');
    skillChatActive = false; 
    skillQuizState = 'AWAITING_RANGE'; 
    setTimeout(resetSelections, 600);
    return;
  }
  
  if (lowerVal.includes('back')) {
    addMessage('bot', 'Going back...');
    skillChatActive = false; 
    skillQuizState = 'AWAITING_RANGE'; 
    setTimeout(handleBack, 600);
    return;
  }

  // Content Decoder
  if (val.startsWith("LOAD_PACKAGE:")) {
    // Check if the mode is Descriptor-Based
    if (currentInteraction.mode === 'descriptor') {
      try {
        const base64Data = val.replace("LOAD_PACKAGE:", "");
        const decodedData = JSON.parse(atob(base64Data));

        if (decodedData.type === "EDUPATH_RICH_CONTENT") {
          addMessage('bot', "Processing Rich Content Package...");
          
          // FIX: Automatically unlock the AI conversation now that content is loaded
          hasUsedInitialKeyword = true; 

          setTimeout(() => {
            const html = renderLesson(decodedData);
            addMessage('bot', html);
            addMessage('bot', "Content loaded successfully. How can I help you with this material?");
          }, 800);
          return; 
        }
      } catch (e) {
        addMessage('bot', "⚠️ Invalid Content Package code.");
        return;
      }
    } else {
      // Feedback if they try to load in Skill-Based mode
      addMessage('bot', "⚠️ Content packages can only be loaded in **Descriptor-Based** mode. Please reset and select Descriptor mode to use this feature.");
      return;
    }
  }

  if (!currentInteraction.mode) {
    return addMessage('bot', 'Please choose a mode and level first.');
  }

  // Routing Logic
  if (currentInteraction.mode === 'skill') {
    const level = currentInteraction.level;
    // ROUTING FIX: Always send Level 4 to handleSkillChat
    if (level === 4 || skillChatActive) {
      setTimeout(() => handleSkillChat(val), 300);
    } else {
      setTimeout(() => handleSkillGenerator(val), 300);
    }
  } 
  else if (currentInteraction.mode === 'descriptor') {
    setTimeout(() => handleDescriptorResponse(val), 300);
  }
}

    document.addEventListener('keydown', function(event) {
    // Check if user is typing in an input or textarea so we don't trigger by accident
    if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;

    const key = event.key.toLowerCase();

    if (key === 'f') {
        // Trigger Fullscreen
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.error(`Error attempting to enable full-screen mode: ${err.message}`);
            });
        }
    } else if (key === 'e') {
        // Exit Fullscreen
        if (document.fullscreenElement) {
            document.exitFullscreen();
        }
    }
});
