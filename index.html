<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <title>APP 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen pb-footer">

    <header class="sticky top-0 z-40">
      <div class="max-w-4xl px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="brand flex items-center gap-3">
            <span class="font-bold text-lg">APP 2026</span>
            <span class="border-1 bprder-white/30 pl-3 font-mono text-xs opacity-70" id="timer-display">00:00</span>
          </div>
        </div>
        <dic class="text-sm text-blue-200" id="step-indicator">Step 1 of 4</dic>
      </div>
    </header>

    <main class="max-w-4xl px-6 py-8" id="main-content">

      <section class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-blue-100 mb-2" id="stepTitle">Select a Topic</h1>
        <p class="text-sm text-gray-400  mb-4" id="step-breadcrumb"></p>
      </section>

      <div class="mb-6 flex justify-between items-center">
        <div class="hidden" id="back-button"><button class="btn" onclick="handleBack()">Back</button></div>
        <div class="hidden" id="reset-button"><button class="btn" onclick="resetSelections()">Reset</button></div>
      </div>

      <div class="grid gap-6" id="step-0">
        <div class="card p-6 cursor-pointer" id="topic-science" role="button" tabIndex="0">
          <div class="flex items-center justify-between">
            <div><h3 class="text-xl font-bold text-blue-200">Science</h3><p class="text-sm text-gray-400 mt-1">Explore Physics, Chemistry and Biology</p></div>
            <div class=text-3xl">👩🏻‍🔬</div>
          </div>
        </div>
      </div>

      <div class="hidden grid grid-cols-1 md:grid-cols-3 gap-6" id="step-1"></div>

      <div class="hidden grid grid-cols-1 md:grid-cols-2 gap-6" id="step-2">
      <div class="card p-6 text-center cursor-pointer" id="mode-descriptor" role="button" tabIndex="0">
        <div class="text-4xl mb-2">📖</div>
        <h3 class="font-bold text-lg text-blue-100">Descriptor-Based</h3>
        <p class="text-sm text-gray-400">Explanations and Discussions</p>
      </div>
      <div class="card p-6 text-center cursor-pointer" id="mode-skill" role="button" tabIndex="0">
        <div class="text-4xl mb-2">📝</div>
        <h3 class="font-bold text-lg text-blue-100">Skill-Based</h3>
        <p class="text-sm text-gray-400">Quizzes and Assessments</p>
      </div>
      </div>

      <div class="hidden grid grid-cols-1 md:grid-cols-3 gap-4" id="step-3a"></div>

      <div class="hidden grid grid-cols-1 md:grid-cols-3 gap-4" id="step-3b"></div>

      <div class="hidden" id="step-4">

        <div id="descriptor-panel" class="hidden">
          <div class="card p-4 mb-4">
            <div class="flex items-center gap-3">
              <div class="text-xl">📖</div>
            <div>
            <div class="font-bold text-blue-100" id="lesson-title">Learning Content</div>
            <div class="text-xs text-gray-400" id="lesson-subtitle">Select a module below</div>
          </div>
        </div>
      </div>
      <div class="mb-4 flex flex-wrap gap-2" id="module-buttons"></div>
      <div class="lesson-container" id="lesson-content"></div>
        </div>

        
    
            
    
          
    
  </body>
