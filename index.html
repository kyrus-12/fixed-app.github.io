    }

    }
    .pb-footer{

    }
    .brand{
      font-weight:800;
      color:var(--text);
    }
    .card{
      background:linear-gradient(180deg, var(--card), rgba(10,14,22,0.8));
      border-radius:0.85rem;
      border:1px solid rgab(96,165,250,0.06);
      box-shadow:0 10px 30px rgba(2,6,23,0.6);
      transition:transform .28s cubic-beizer(.2,.9,.2,1), box-shadow .28s;
    }
    .card:hover{
      transform:translateY(-6px);
      box-shadow:0 22px 50px rgba(96,165,250,0.08);
      border-color:rgba(96,165,250,0.12);
    }
    .btn{
      background:transparent;
      color:var(--text);
      border-radius:0.65rem;
      padding:6rem 1rem;
      border:1px solid rgba(96,165,250,0.06);
      cursor:pointer;
      font-weight:900;
      box-shadow:0 6px 18px rgba(2,6,23,0.6);
      transition:all .18s ease;
    }
    .btn:hover{
      box-shadow:0 8px 22px rgba(96,165,250,0.06);
      transform:translateY(-2px);
    }
    .btn-primary{
      background:var(--color-primary);
      border:none;
    }
    .btn-primary:hover{
      background:var(--color-primary-dark);
    }
    .selected{
      box-shadow:0 0 18px rgba(96,165,250,0.12);
      border-color:var(--color-primary);
    }
    .message-wrapper{
      display:flex;
      align-items:flex-end;
      gap:.5rem;
      margin:.5rem 0;
    }
    .user-wrapper{
      justify-content:flex-end;
      flex-direction:row-reverse;
    }
    .message-avatar{
      width:34px;
      height:34px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      flex-shrink:0;
    }
    .bot-avatar{
      background:var(--color-primary-dark);
      color:white;
    }
    .user-avatar{
      background:var(--color-glow);
      color:white;
    }
    .message-bubble{
      padding:6rem .9rem;
      border-radius:14px;
      max-width:90%;
      line-height:1.9;
    }
    .bot-message{
      background:rgba(96,165,250,0.08);
      color:var(--text);
    }
    .user-message{
      background:var(--color-primary-dark);
      color:white;
      align-self:flex-end;
    }
    footer.global-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);

      padding:.35rem .5rem;

    @keyframes fadeInUp{ from{

      transform:translateY(0)} }
    .fade-in{
      opacity:0;
      animation:fadeInUp .56s cubic-beizer(.2,.9,.2,.1) forwards}
    .stagger > *{
      opacity:0;
    }
    .stagger.show > *{
      animation:fadeInUp .56s cubic-beizer(.2,.9,.2,.1) forwards}
    .stagger.show > *:nth-child(1){animation-delay:.05s}
    .stagger.show > *:nth-child(2){animation-delay:.12s}
    .stagger.show > *:nth-child(3){animation-delay:.2s}
    .stagger.show > *:nth-child(4){animation-delay:.28s}
    .stagger.show > *:nth-child(5){animation-delay:.36s}

             { q: 'Explain how a climate model helps governments prepare for real-world events before they happen.', a: 'It allows governments to simulate "what-if" scenarios, such as rising sea levels, so they can build infrastructure or pass policies before the actual disaster occurs.' },             
             { q: 'Compare an atomic orbital model to a map of a city. How are they both simplifications of a complex reality?', a: 'Both ignore specific details (like every blade of grass or the exact position of an electron) to focus on providing a functional layout or map of where things are likely to be.' },
             { q: 'Analyze why a scientist might use a computer simulation of plate tectonics rather than observing the Earth directly.', a: 'Plate tectonics happen too slowly (over millions of years) and deep underground for direct observation, so simulations allow scientists to compress time and see through the Earth.' },
             { q: 'If a model’s prediction does not match the results of an experiment, what should a scientist do with the model?', a: 'The scientist should evaluate the model, identify the flaws, and revise or discard it to better align with the new empirical evidence.' },

                  { q: 'Why does sugar seem to disappear in water but still taste sweet?', a: 'particles spread out' },
                  { q: 'Why do wood and metal act differently?', a: 'different particles' },

{ q: 'Why does food coloring spread in water?', a: 'Particles move randomly' },
{ q: 'Why do gases fill their container?', a: 'Particles move freely' },
{ q: 'Why do solids keep their shape?', a: 'Particles vibrate in place' },
{ q: 'Why do liquids flow?', a: 'Particles slide past each other' },
{ q: 'Why does metal expand when heated?', a: 'Particles move further apart' },
{ q: 'Why can we smell perfume across a room?', a: 'Particles move through air' },
{ q: 'Why do gases have more space than solids?', a: 'Particles are far apart' },
{ q: 'What causes diffusion to speed up?', a: 'Added heat' },
{ q: 'Why do solids not take container shape?', a: 'Fixed particle pattern' },
{ q: 'How do particle forces differ by state?', a: 'Strength varies by state' },
{ q: 'Why does a balloon inflate with air?', a: 'Particles fill space' }, 
             { q: 'Explain why solids have a definite shape but gases do not, using the particle model.', a: 'Solids have particles in fixed, regular patterns that vibrate in place, cannot move past each other, so shape is fixed. Gases have particles moving freely in all directions with no fixed arrangement, so they take the shape of their container and expand to fill it.' },
             { q: 'A block of butter is left on a warm countertop and melts. Describe the changes in particle spacing, motion, and energy that occur.', a: 'Energy: Gains thermal energy (endothermic). Motion: Particles vibrate more vigorously until they can slide past one another. Spacing: Particles move slightly further apart than in the solid state.' },
             { q: 'Two identical balloons are filled with air – one is placed in a freezer, the other in direct sunlight. Predict what will happen to each balloon and explain why using particle behavior.', a: 'Freezer balloon: Shrinks, cold reduces particle kinetic energy, so particles move slower and closer together, decreasing volume. Sunlight balloon: Expands, heat increases particle kinetic energy, so particles move faster and further apart, increasing volume.' },
             { q: 'Analyze why liquids can flow but solids cannot, based on particle arrangement and motion.', a: 'Liquids have particles that can slide past one another (no fixed pattern), allowing them to flow. Solids have particles locked in fixed positions that only vibrate, so they cannot flow.' },
             { q: 'Why is it easier to compress a gas than a liquid or solid? Use particle spacing to support your answer.', a: 'Gases have large spaces between particles, pressure can push particles closer together. Solids and liquids have very little space between particles, so there is no room to compress them significantly.' },
{ q: 'You are looking at a diagram where particles are close together but have no regular pattern. Identify the state of matter and describe how these particles move.', a: 'This is a liquid; the particles move by sliding or flowing past one another while remaining in contact.' },
{ q: 'Compare the spacing in a liquid diagram versus a gas diagram. How does this difference affect the volume of the substance?', a: 'In a liquid, particles are touching, giving it a fixed volume; in a gas, they are far apart, meaning the volume can expand or contract to fill any container.' },
{ q: 'Analyze why collision symbols (like small x marks) are necessary in a gas diagram but not in a solid diagram.', a: 'Gas particles move rapidly and randomly, frequently hitting each other and the container; solid particles are fixed in place and do not collide in this manner.' },
{ q: 'If a substance’s particle diagram changes from a regular lattice to a random cluster where particles can slide, what physical change has occurred?', a: 'The substance has undergone melting (solid to liquid).' },
{ q: 'Explain how long arrows in a gas diagram relate to the kinetic energy of the particles compared to the short arrows in a solid.', a: 'Long arrows represent high velocity and high kinetic energy, whereas short arrows (vibration marks) represent the low kinetic energy found in solids.' },
             { q: 'Using the particle model, explain how a liquid thermometer measures a rise in temperature.', a: 'As the liquid is heated, its particles move faster and spread apart, forcing the liquid to expand and rise up the narrow tube.' },
             { q: 'Analyze why oil and water form separate layers instead of mixing.', a: 'Oil is nonpolar and water is polar; their particles repel each other because their intermolecular forces are incompatible.' },
             { q: 'Explain the scientific principle behind how hydraulic brakes transmit force using the particle model.', a: 'Liquids are incompressible because their particles are already close together; therefore, pressure applied at one end is transmitted fully to the other end.' },
             { q: 'Predict what would happen to a sealed bag of chips taken from a cool room to a hot beach. Explain using particle collisions.', a: 'The bag will expand or bloat because the gas particles inside move faster and collide more forcefully with the bag’s walls as temperature increases.' },
             { q: 'Why does salt dissolve in water but sand does not? Contrast their attractive forces.', a: 'Salt is polar and its ions are pulled apart by polar water molecules; sand has extremely strong internal attractive forces that water particles cannot overcome.' },
             
             
             
{ q: 'Why does ice melt at room temperature?', a: 'Gains thermal energy' },
{ q: 'Why does water freeze in a freezer?', a: 'Loses thermal energy' },
{ q: 'Why do puddles dry on sunny days?', a: 'Water evaporates' },
{ q: 'Why do droplets form on cold glasses?', a: 'Water vapor condenses' },
{ q: 'Why does dry ice turn to gas?', a: 'Undergoes sublimation' },
{ q: 'Why do solids have definite volume?', a: 'Particles tightly packed' },
{ q: 'Why do gases expand to fill space?', a: 'Particles move freely' },
{ q: 'Why does boiling produce steam?', a: 'Rapid evaporation' },
{ q: 'Why do clouds form in cool air?', a: 'Moisture condenses' },
{ q: 'Why does melting not change volume much?', a: 'Particles stay close' },
{ q: 'Why do gases compress easily?', a: 'Space between particles' }, 
             { q: 'Explain why the temperature of water remains constant while it is boiling, even though heat is still being added.', a: 'The heat energy is used to break the attractive forces between water particles (to change from liquid to gas) rather than increasing the kinetic energy of particles, so temperature does not rise until all water has boiled into steam.' },
             { q: 'A glass of cold water forms droplets on its outside on a warm day. Identify the change of state occurring and describe the energy changes and particle behavior involved.', a: 'Change of state: Condensation (Gas to Liquid). Energy: Water vapor particles lose heat energy (exothermic). Behavior: Particles slow down, move closer together, and form liquid droplets as attractive forces pull them into clusters.' },
             { q: 'Dry ice is used to keep food cold during shipping. Explain how dry ice works, including the change of state it undergoes and how this process helps maintain low temperatures.', a: 'Dry ice undergoes sublimation (Solid → Gas), which is an endothermic process. It absorbs heat energy from the surroundings (including the food and air). This absorption of heat keeps the area cold and prevents food from spoiling.' },
             { q: 'Compare and contrast evaporation and boiling. What are their similarities and differences in terms of energy, location, and temperature?', a: 'Similarities: Both are Liquid to Gas changes; both endothermic (absorb heat). Differences: Evaporation occurs at the surface, at any temperature below boiling point; boiling occurs throughout the liquid at a specific boiling point.' },
             { q: 'When water freezes into ice, it expands slightly. Using particle arrangement, explain why this happens despite particles losing energy and moving closer together.', a: 'As water freezes, particles form a regular lattice structure with spaces between molecules (due to hydrogen bonding). Even though particles move closer together overall, the structured arrangement creates more space than the random arrangement in liquid water, causing expansion.' },
{ q: 'During melting, heat is absorbed but the temperature does not rise. Explain what this energy is being used for at the particle level.', a: 'The energy is used to overcome the attractive forces (bonds) holding the particles together in the solid lattice rather than increasing their kinetic energy (temperature).' },
{ q: 'Analyze the process of condensation (Gas to Liquid). Describe the changes in energy, motion, and attractive forces.', a: 'Energy is released (exothermic), particle motion slows down, and attractive forces become strong enough to pull the particles close together into a liquid state.' },
{ q: 'Compare Sublimation and Deposition. Which one is endothermic, and how does the particle arrangement change in each?', a: 'Sublimation is endothermic (solid to gas, particles move from a lattice to being far apart); Deposition is exothermic (gas to solid, particles move from being far apart into a fixed lattice).' },
{ q: 'Why do you feel cold when water evaporates off your skin? Link this to the behavior of high-energy particles.', a: 'The highest-energy particles leave as gas, taking their heat with them; since energy is absorbed from your skin to facilitate this, your skin temperature drops.' },
{ q: 'Explain why frost on a window is an example of deposition rather than freezing.', a: 'Frost forms when water vapor in the air touches a very cold surface and turns directly into solid ice crystals without becoming liquid water first.' },

             
             
             { q: 'A student observes that plants near a window grow taller than plants in a dark corner. Design a simple scientific investigation to test why this happens. Identify the question, hypothesis, variables, and basic testing steps.', a: 'Question: How does the amount of sunlight affect plant growth? Hypothesis: If plants receive more sunlight, then they will grow taller because sunlight is required for photosynthesis to produce energy for growth. Variables: Independent = amount of sunlight (e.g., 0 hours, 4 hours, 8 hours); Dependent = plant height; Controlled = type of plant, pot size, amount of water, soil type. Steps: Plant 3 identical plants in same conditions; expose each to different sunlight amounts; measure height weekly for 4 weeks; record and compare data.' },
             { q: 'When measuring the volume of liquid in a graduated cylinder, why is it important to read the measurement at eye level? Explain how parallax error can affect results.', a: 'Reading at eye level ensures accuracy. Parallax error occurs when the eye is not level, the liquid surface appears higher or lower than it actually is, leading to overestimation or underestimation of volume.' },
             { q: 'A group tests how the number of light bulbs affects the brightness of a circuit. They change the number of bulbs but also use different types of batteries each time. Analyze what is wrong with their experiment and how to fix it.', a: 'Problem: More than one variable is changed (number of bulbs and battery type), cannot tell which variable affects brightness. Fix: Keep battery type (and other factors like wire length, bulb type) constant; only change the number of bulbs.' },
             { q: 'A student collects data showing that as the amount of fertilizer increases, plant growth first increases then decreases. How should they analyze and present this data to make the pattern clear?', a: 'Organize data in a table with fertilizer amount and corresponding plant growth; create a line graph with fertilizer amount on the x-axis and growth on the y-axis. This will clearly show the increasing then decreasing trend.' },
             { q: 'Apply the steps of a scientific investigation to a real-world problem: Why does bread mold faster in a plastic bag than on a plate? Outline each step with specific details.', a: '1. Observation: Bread in plastic bags develops mold sooner than bread on open plates; 2. Question: How does storage method (plastic bag vs. open plate) affect the rate at which bread molds?; 3. Hypothesis: If bread is stored in a plastic bag, then it will mold faster because plastic traps moisture and air, creating better conditions for mold growth; 4. Testing: Place identical pieces of bread in plastic bags and on plates; keep temperature, humidity, and bread type constant; check daily and record when mold appears; 5. Analysis: Compare mold appearance dates and create a table/graph of results;  6. Conclusion: State whether data supports hypothesis and explain how moisture/trapped air affects mold growth.' },
{ q: 'In the Particle Size investigation, why was it important to keep the stirring speed and water temperature the same for all three tests?', a: 'To ensure a fair test; these were controlled variables so that any difference in dissolution time could be attributed solely to the particle size.' },
{ q: 'Analyze the results: Why did the powdered sugar dissolve in 11 seconds while the cubes took 182 seconds? Use the concept of surface area.', a: 'Powdered sugar has a much higher surface area, allowing more water molecules to come into contact with and pull away sugar particles simultaneously compared to a solid cube.' },
{ q: 'If you have an unknown clear liquid that turns red litmus paper blue, classify the substance and give a household example of what it might be.', a: 'The substance is a base (alkaline); a common household example is bleach or soapy water.' },
{ q: 'Compare the effects of temperature on solubility versus dissolution rate. Does a higher temperature always mean more solute can dissolve?', a: 'Higher temperature always increases the dissolution rate (speed), but while it usually increases solubility (amount) for solids, it actually decreases the solubility of gases in liquids.' },
{ q: 'Explain how you would design a test to see if Stirring affects the maximum amount of salt that can dissolve in water.', a: 'You would add salt to two containers of water at the same temperature, stirring one and leaving the other still, then measure the total mass of salt dissolved in each until saturation is reached.' },
             { q: 'Formulate a hypothesis for how temperature affects the solubility of Oxygen gas in water.', a: 'If water temperature increases, the solubility of Oxygen gas will decrease because higher kinetic energy allows gas particles to escape the liquid surface.' },
             { q: 'Analyze why blue litmus paper turns red in vinegar. Describe the chemical interaction.', a: 'Vinegar contains H⁺ ions which react with the litmus dye, changing its chemical structure and turning it red.' },
             { q: 'You are given 100 mL of seawater. Outline the steps to find its salinity (salt concentration) by mass.', a: 'Weigh an evaporating dish, add 100 mL of seawater, evaporate the water over heat, cool in a desiccator, and weigh the remaining salt.' },
             { q: 'Compare the solubility-temperature relationship of salt (NaCl) versus sugar. Which is more sensitive to heat?', a: 'Sugar is much more sensitive to heat; its solubility increases drastically with temperature, whereas salt solubility only increases slightly.' },
             { q: 'A student forgets to dry their filter paper before weighing the undissolved salt. Analyze how this error affects the calculated dissolved salt mass.', a: 'The undissolved salt mass would appear higher (due to water weight), which would make the dissolved salt mass (Total - Undissolved) appear lower than it actually is.' },

{ q: 'Why is salt water a solution?', a: 'Uniform composition' },

{ q: 'Why is water called universal solvent?', a: 'Dissolves many substances' },

             { q: 'Calculate the concentration (g/L) of a solution made by dissolving 15 grams of salt in 0.3 liters of water. Show your work.', a: 'Formula: Concentration (g/L) = Mass of solute (g) ÷ Volume of solvent (L); Calculation: 15 g ÷ 0.3 L = 50 g/L; Answer: 50 g/L' },
             { q: 'A 5% sugar solution by mass is made with 20 grams of sugar. How much water is needed to make the solution? Explain your calculation.', a: 'A 5% solution means 5 grams of sugar per 100 grams of solution; If 5 grams sugar = 100 grams solution, then 20 grams sugar = (20 ÷ 5) × 100 = 400 grams total solution; Mass of water = Total solution mass – Mass of sugar = 400 g – 20 g = 380 g; Answer: 380 grams of water (since 1g water ≈ 1mL, this is also ~380mL).' },
               { q: 'Why does soda go flat when opened and left out? Use solubility and gas behavior to explain.', a: 'Soda is carbonated under high pressure to dissolve CO₂ gas. When opened, pressure decreases, reducing gas solubility and causing some CO₂ to escape. When left out, temperature increases (or stays above cold storage temp), further reducing solubility, more CO₂ escapes until little remains dissolved, making the soda flat.' },
               { q: 'A student wants to dissolve a large amount of sugar in water quickly. What three things could they do to speed up the process, and how does each work?', a: '1. Increase temperature: Higher temps speed up solvent particles, allowing them to break down solute faster; 2. Stir the mixture: Spreads solvent around solute, bringing fresh solvent into contact with undissolved sugar; 3. Use granulated sugar instead of sugar cubes: Smaller particles have more surface area exposed to solvent.' },
             { q: 'Compare the solubility of table salt and sugar in water at 20°C (assume salt dissolves ~36g/100mL; sugar dissolves ~204g/100mL). What do these numbers tell us about the two solutes?', a: 'The numbers show that sugar is much more soluble in water than table salt at 20°C. This means water can hold a far greater mass of sugar than salt before becoming saturated (unable to dissolve more solute).' },

           3: {
              questions: [
                { q: 'Compare a globe and a flat world map as models. Which is more accurate for showing Earth’s shape, and why?', a: 'Globe accurately represents Earth’s spherical shape, while flat maps distort landmass sizes, distances, and the curvature of the planet.' },
                  { q: 'A student makes a model of the solar system using marbles. What are the strengths and weaknesses of this model?', a: 'Strengths: Clearly shows the order of planets from the Sun and their relative round shapes. Weaknesses: Fails to match real size ratios (planets and Sun are vastly different in scale) and distance proportions between celestial bodies.' },
                  { q: 'Would a 3D printed heart be considered a scientific model? Justify your answer.', a: 'Yes, it is a simplified representation of a complex biological structure that helps teach anatomy, plan medical procedures, or test new treatments, which aligns with the purpose of scientific models.' },
                  { q: 'Evaluate whether a toy car is a good model for teaching how real cars work. Support your evaluation with reasons.', a: 'It is partially good. It shows basic structure (wheels, body shape, parts placement) but is not effective for teaching mechanics, engine function, or safety systems, as it lacks those critical components.' },
                  { q: 'Which model would be more useful for explaining the water cycle: a static drawing or a moving animation? Evaluate both options.', a: 'A static drawing is good for showing key steps clearly, while a moving animation is more useful for demonstrating the flow and sequence of processes like evaporation and precipitation. The animation is stronger for understanding dynamic movement, but the drawing is better for quick reference.' },
             { q: 'A student argues that scientific models are just guesses because they aren’t 100% accurate. Evaluate this statement based on the lesson’s explanation of model limitations and revisions.', a: 'The statement is flawed because models are based on evidence and logic, not random guessing; their lack of 100% accuracy is a deliberate choice for simplification, and they are refined as our understanding grows.' },
             { q: 'Evaluate the importance of the Testing Theories function of models. How does this specific function drive scientific progress?', a: 'This function is vital because it allows scientists to see if a theory holds up under different conditions; if the model fails, it forces the development of new, more accurate theories, which is the engine of progress.' },
             { q: 'If you were designing a model of a virus to study how it spreads, evaluate which variables are essential to include and which are non-essential details you would strip away.', a: 'Essential variables include the infection rate and transmission method (airborne vs. contact); non-essential details would be the specific visual color of the virus or its internal chemical complexity that doesn’t affect movement.' },
             
             
             { q: 'Evaluate the claim: If you can’t see particles, they don’t exist. Use evidence to support your judgment.', a: 'The claim is false. Evidence includes sugar dissolving in water (particles spread but are still present, as shown by taste) and air inflating a balloon (particles push outward even though invisible).' },
                  { q: 'Why do different liquids mix in some cases but not others? Use the particle model to explain and evaluate if this is a consistent pattern.', a: 'Particles of compatible liquids fit between one another due to similar properties, while incompatible particles repel or have different sizes/shapes that prevent even mixing. This is a consistent pattern observed in most substances, though temperature or pressure can sometimes alter compatibility.' },
                  { q: 'How would the particle model explain why a balloon inflates when air is blown into it? Evaluate if this explanation is sufficient to describe the process.', a: 'Air particles fill the space inside the balloon, pushing against the inner surface as they move and spread out, causing expansion. This explanation is sufficient because it accounts for the observable change in shape and the behavior of tiny particles.' },
                  { q: 'A piece of paper burns but a metal spoon doesn’t when heated. Use particle theory to explain the difference and evaluate why this matters for everyday use.', a: 'Paper particles break down and react with oxygen when heated, releasing energy as fire; metal particles have strong bonds that resist breaking down at typical heating temperatures. This matters because it determines how we use materials (e.g., metal for cookware, paper for fuel).' },
                  { q: 'Predict what would happen if you compressed air in a bottle using the particle model, then evaluate whether this prediction can be tested.', a: 'Particles would be forced closer together, increasing pressure inside the bottle. This can be tested by using a pump to compress air and observing if a attached gauge shows higher pressure or if the bottle deforms under force.' },
{ q: 'Compare how particle spacing affects density in solids vs. gases. Explain the relationship.', a: 'Solid particles are tightly packed, so more mass fits in a given volume, making solids denser; gas particles are far apart with large empty spaces, so less mass is present per volume, resulting in much lower density. This is why gases rise and solids sink in most cases.' },
{ q: 'Explain why some solids conduct heat better than others using the particle model.', a: 'Metals have particles with free-moving electrons that transfer energy quickly between particles; non-conductors have particles with fixed electrons, so energy moves slowly through vibration only. This difference in particle interaction causes varying heat transfer rates.' },
{ q: 'Evaluate whether the particle model can explain why sound travels faster in solids than gases – justify your answer.', a: 'Yes, sound moves through particle collisions; solid particles are close together, so collisions happen faster and transfer sound energy quickly; gas particles are far apart, so collisions are less frequent and sound travels slower – this matches real-world observations.' },
{ q: 'How would particle behavior change if a gas were compressed into a liquid? What forces are involved?', a: 'Compressing a gas pushes particles close together until attractive forces between them are strong enough to hold them in a liquid arrangement; particles slow down as they lose energy from compression, transitioning from free movement to sliding past each other.' },
{ q: 'Why does the particle model need to be updated as new discoveries are made?', a: 'Early models focused only on basic arrangement and motion, but new research shows particles have subatomic structure, charge, and complex interactions; updating the model ensures it accurately explains new observations like magnetism, conductivity, and quantum behavior.' },
{ q: 'Predict what would happen to particle motion if a substance were heated beyond its boiling point – explain your reasoning.', a: 'Particles would move even faster and spread further apart, becoming a gas with higher kinetic energy; if heated enough, particles would break into charged particles and form plasma, where motion is extremely fast and interactions involve electric forces.' },
{ q: 'Compare how particle spacing changes when a gas expands vs. a liquid expands. What’s the key difference?', a: 'When a gas expands, particles move further apart into new space, increasing volume significantly; when a liquid expands, particles only move slightly further apart, so volume increase is much smaller. This is why gases are used in thermometers for large temperature ranges and liquids for smaller ones.' },
{ q: 'How would you use the particle model to explain why a metal can dents when dropped but a glass can breaks?', a: 'Metal particles are arranged in layers that can slide past each other when force is applied, causing a dent; glass particles are fixed in a rigid lattice that cannot move, so force causes bonds to break and the glass to shatter. This difference in particle arrangement explains their behavior.' },
{ q: 'Explain why some liquids are viscous (thick) while others are runny. How does the particle model apply?', a: 'Viscous liquids have strong attractive forces between particles that slow their movement; runny liquids have weaker forces that allow particles to slide past each other easily. Temperature also affects viscosity, as heat weakens forces and makes thick liquids flow faster.' },
             { q: 'A student claims that heating a substance always makes it expand. Evaluate this statement, is it completely true? Provide evidence from the particle model to support your judgement.', a: '- Not completely true. Most substances expand when heated (particles move faster and spread out), but water is an exception. When it freezes (cools from 4°C to 0°C), it expands as particles form a lattice structure with more space between them. Also, heating a substance at its melting/boiling point does not cause expansion until the change of state is complete.' },
             { q: 'Two substances are at the same temperature but are different states of matter (one solid, one gas). Evaluate whether their particles have the same average kinetic energy, and explain why this is possible despite their different behaviors.', a: '- Yes, they have the same average kinetic energy (temperature is a measure of this). The difference in behavior comes from particle spacing and forces of attraction. Gas particles are far apart with weak forces, so they move freely; solid particles are close together with strong forces, so they only vibrate.' },
             { q: 'A company wants to design a container to store a highly compressible substance. Evaluate which state of matter the substance is likely to be, and justify the design features the container should have based on particle properties.', a: 'Likely a gas (only gases are highly compressible). Design features: Should be strong (to withstand pressure changes), sealable (to prevent gas escape), and possibly expandable or have adjustable volume. Since gas particles spread to fill space, the container must contain them without breaking.' },
             { q: 'Some people think that cold makes particles stop moving. Evaluate this misconception and explain the correct behavior of particles at low temperatures.', a: 'False. Particles never stop moving, even at very low temperatures. As temperature decreases, kinetic energy reduces, so particles move slower and closer together but they still have some motion (e.g., vibrations in solids). Only at absolute zero (-273.15°C) would particles theoretically have zero kinetic energy, but this temperature cannot be reached.' },
             { q: 'Evaluate how the particle model helps us understand why cooking food in boiling water (100°C) is faster than cooking it in warm water (50°C), linking temperature, particle motion, and heat transfer.', a: 'The particle model explains that higher temperature means faster particle motion. In boiling water, water particles move faster and collide more frequently with food particles, transferring heat more quickly. This increased heat transfer speeds up chemical reactions in the food, making it cook faster. Without the particle model, we could observe the difference but not explain why temperature affects cooking speed.' },
{ q: 'Evaluate the effectiveness of using 2D circles to represent 3D atoms. What information does this model successfully communicate, and what might it fail to show?', a: 'It successfully communicates relative spacing and arrangement; however, it fails to show the 3D spherical nature of atoms or the complex internal structure (protons/electrons).' },
{ q: 'A diagram shows particles spread far apart but with no motion arrows. Evaluate whether this is an accurate representation of a gas and justify your reasoning.', a: 'It is inaccurate because gas particles must be in constant motion; without arrows, the model suggests the particles are static, which violates the laws of thermodynamics.' },
{ q: 'Based on the particle model, evaluate why it is impossible for a solid to flow like a liquid or gas.', a: 'Flowing requires particles to move past one another; in a solid, the strong attractive forces lock particles into a fixed lattice, preventing the relative movement needed for flow.' },
             { q: 'A student argues that all matter shrinks when it gets cold. Evaluate this statement using the behavior of water as a counter-argument.', a: 'The statement is mostly true but incomplete; water is a critical exception because it expands when it freezes into ice due to its specific lattice arrangement.' },
             { q: 'Evaluate the design of a scuba tank. Why is it advantageous to store air as a compressed gas rather than a liquid?', a: 'Gases are highly compressible due to the large spaces between particles, allowing a massive amount of breathable air to be squeezed into a small, portable volume.' },
             { q: 'Evaluate the rule like dissolves like. How does this help chemists predict whether a new cleaning solvent will remove a grease stain (nonpolar)?', a: 'Grease is nonpolar, so the rule predicts that only a nonpolar solvent will have compatible intermolecular forces to surround and dissolve the grease particles.' },
             
             
             
             
             
             
{ q: 'Explain why different substances have different boiling points. Use particle attraction to support your answer.', a: 'When a gas expands, particles move further apart into new space, increasing volume significantly; when a liquid expands, particles only move slightly further apart, so volume increase is much smaller. This is why gases are used in thermometers for large temperature ranges and liquids for smaller ones.' },
{ q: 'Why does condensation form on the outside of a cold drink but not a warm one? Relate to air particles.', a: 'Warm air contains water vapor particles moving fast enough to stay in gas form; when this air touches a cold surface, vapor particles lose energy, slow down, and are pulled together by attractive forces to form liquid droplets. Warm surfaces don’t cool the air enough for this to happen.' },
{ q: 'Predict how a change in pressure would affect sublimation rate. Explain with particle theory.', a: 'Increasing pressure pushes solid particles closer together, making it harder for them to escape to gas form, so sublimation slows down; decreasing pressure allows particles to break free more easily, speeding up sublimation. This is why dry ice sublimes faster at high altitudes with lower pressure.' },
{ q: 'Evaluate whether freezing rain is a combination of state changes. What evidence supports this?', a: 'Yes, water vapor condenses into liquid droplets high in the atmosphere, then falls through a layer of cold air close to the ground and freezes into ice on contact with surfaces; this involves both condensation (gas to liquid) and freezing (liquid to solid) in sequence.' },
{ q: 'Explain why adding salt to ice lowers its freezing point. How does this affect particle arrangement?', a: 'Salt particles interfere with water particles trying to form a solid lattice, so more energy must be removed (lower temperature) for freezing to occur; the salt dissolves in melted water, breaking into ions that disrupt the regular particle pattern ice needs to form.' },
{ q: 'How do state changes contribute to Earth’s weather cycle. Describe the sequence of changes involved.', a: 'Water evaporates from oceans (liquid to gas) due to heat from the sun; vapor rises, cools, and condenses into clouds (gas to liquid); when droplets grow heavy, they fall as precipitation (liquid to solid or liquid); snow melts back to liquid (solid to liquid) or sublimes to gas, completing the cycle.' },
{ q: 'Predict what would happen if you tried to freeze a gas like oxygen at room temperature. Explain your reasoning.', a: 'Oxygen would not freeze because room temperature is much higher than its freezing point (-218°C); gas particles have too much kinetic energy to be pulled into a solid arrangement. Extreme cooling would be needed to slow particles enough for freezing to occur.' },
{ q: 'Use particle theory to explain why some substances can exist in multiple states at once (like water at 0°C).', a: 'At 0°C, water can be solid ice and liquid water simultaneously. Some particles have enough energy to stay liquid while others lose energy and freeze; energy is exchanged between particles, keeping temperature constant as the state change occurs.' },
{ q: 'Evaluate whether state changes are important for living organisms. Give examples to support your answer.', a: 'Yes, plants rely on water evaporation to pull nutrients from roots to leaves; animals use sweating (evaporation) to cool down; freezing preserves food and water for wildlife in cold climates; condensation provides water for plants and animals in areas with fog or dew.' },
             { q: 'A student suggests that melting and freezing are opposite processes but not equal in terms of energy. Evaluate this claim and explain whether the energy absorbed during melting is equal to the energy released during freezing for the same amount of substance.', a: 'The claim is incorrect. Melting and freezing are opposite and equal in energy. The amount of heat absorbed to melt a substance is the same as the heat released when the same amount of that substance freezes (this is called latent heat). For example, 1kg of ice absorbs 334kJ of heat to melt; 1kg of water releases 334kJ when freezing.' },
             { q: 'In cold climates, frost sometimes forms on windows even when the air temperature is above 0°C. Evaluate how this is possible, identifying the change of state and justifying the conditions that allow it to occur.', a: 'Changes of state: Deposition (Gas to Solid). The window glass can be colder than the air temperature (e.g., if it’s exposed to cold outside air). Water vapor in the warmer air comes into contact with the cold glass, loses enough energy to form ice crystals directly without becoming liquid first.' },
             { q: 'A restaurant wants to quickly cool down hot soup. One employee suggests putting it in the freezer, another suggests placing it in a bowl of ice water. Evaluate both methods, considering the changes of state involved and which would be more effective.', a: 'Freezer method: Uses freezing (liquid to solid) of water in the freezer to absorb heat. Risks soup freezing unevenly or forming ice crystals that affect texture; Ice water method: Uses melting (solid to liquid) of ice, melting is endothermic and absorbs a large amount of heat quickly. More effective because it cools the soup uniformly and prevents freezing, maintaining texture.' },
             { q: 'Some people believe that boiling water is hotter than steam. Evaluate this misconception and explain the relationship between the temperature of boiling water and steam at the same pressure.', a: 'False. At the same pressure (e.g., sea level), boiling water and steam are both 100°C. Steam has more total energy because it contains the latent heat of vaporization (the energy used to change from liquid to gas), but its temperature is the same as boiling water.' },
             { q: 'Evaluate why sublimation is useful for certain applications (like freeze-drying food) compared to other changes of state. What advantages does it offer?', a: 'Sublimation is useful because it removes water from substances without passing through the liquid state. Advantages: Prevents food from becoming soggy or losing texture (unlike melting/evaporation); preserves nutrients better; creates lightweight, shelf-stable products that can be rehydrated easily.' },
{ q: 'Evaluate the statement: Dry ice is colder than regular ice because it doesn’t melt. Use the concept of sublimation and energy absorption to support your judgment.', a: 'The statement is partially correct; dry ice is colder because it sublimes, absorbing a large amount of energy directly from the environment to go from solid to gas, maintaining a much lower temperature than melting water ice.' },
{ q: 'A student thinks that Steam is hotter than boiling water. Evaluate this based on the plateau of temperature during a change of state.', a: 'While both exist at 100°C during the phase change, steam contains more total energy (latent heat) than boiling water; however, once all water is steam, it can be heated to much higher temperatures than liquid water.' },
{ q: 'Evaluate the role of Interparticle Forces during freezing. Why must energy be released (exothermic) for these forces to lock particles into a lattice?', a: 'Energy must be released so that the particles slow down enough for the interparticle attractive forces to "catch" them and pull them into the stable, low-energy arrangement of a solid lattice.' },

             
             { q: 'A student’s hypothesis states: If plants are watered more, they will grow taller. Evaluate this hypothesis, is it testable and clear? What improvements would make it a stronger hypothesis?', a: 'It is testable but not clear enough. Improvements: Specify the plant type, define more water (e.g., twice as much water as the control group), and add a because statement to explain the reasoning. Stronger version: If tomato plants are watered 500mL daily (twice the control amount), then they will grow taller because adequate water supports nutrient transport and cell growth.' },
             { q: 'Two groups conduct the same experiment testing how temperature affects magnet strength. Group A gets results showing strength increases with temperature; Group B gets results showing strength decreases. Evaluate possible reasons for the different results and how to determine which data is reliable.', a: 'Possible reasons: Different magnet types, inconsistent testing methods, measurement errors, uncontrolled variables (e.g., magnet size, how strength was measured). To determine reliability: Check if both groups followed the same procedure; repeat the experiment with standardized materials and methods; compare results with established scientific knowledge (most magnets lose strength at high temperatures).' },
              { q: 'A company claims their new fertilizer makes plants grow 50% faster. Evaluate what evidence you would need to accept this claim, including details about how the investigation should be designed and what data should be collected.', a: 'Evidence needed: Results from a controlled experiment with a control group (plants without fertilizer) and experimental group (plants with fertilizer); same plant type, growing conditions, and sample size (at least 10 plants per group); data on growth rate (height, mass, time taken to reach maturity) collected over time; statistical analysis showing results are significant (not due to chance); independent replication of the experiment by other scientists.' },
              { q: 'Some people say scientific investigations always prove the hypothesis correct. Evaluate this statement and explain the role of evidence in supporting or rejecting a hypothesis.', a: 'False. Scientific investigations do not prove hypotheses. They either support or reject them based on evidence. If data does not match the hypothesis, it is rejected or modified, which is just as important for advancing knowledge. The goal is to find evidence-based explanations, not to confirm initial ideas.' },
              { q: 'Evaluate the importance of using SI units in scientific investigations. How would results be affected if different scientists used different measurement systems?', a: 'SI units ensure consistency and comparability worldwide. Without standard units, scientists could not understand or replicate each other’s results (e.g., a cup of water varies by region, while 250mL is the same everywhere). This would slow progress, lead to errors, and make it impossible to combine data from multiple studies.' },
{ q: 'Evaluate the Results Recording table in Lesson 4. Why are three trials necessary for each sugar type instead of just one?', a: 'Three trials are necessary to ensure reliability and identify anomalies; taking an average reduces the impact of timing errors or variations in stirring.' },
{ q: 'A student claims that Soap is an acid because it cleans things. Evaluate this claim using the expected results from the litmus paper activity.', a: 'The claim is incorrect; the litmus test would show that soap turns red litmus paper blue, proving it is a base, which is a chemical property often associated with breaking down fats and oils.' },
{ q: 'Evaluate the conclusion of the sugar investigation. What new question was proposed at the end, and why is it a logical next step for a scientist?', a: 'The question asked how temperature would affect the results; this is a logical next step because it isolates another variable to see how different environmental factors interact with particle size.' },
             { q: 'Evaluate the validity of using litmus paper to determine the exact pH of a solution. What are its limitations?', a: 'Litmus paper is a qualitative tool that only identifies if a substance is an acid or base; it cannot provide a specific numerical pH value (e.g., distinguishing between pH 1 and pH 4).' },
             { q: 'A company needs to keep a carbonated drink from going flat. Evaluate whether they should store it in a warm warehouse or a cold refrigerator. Justify using gas solubility.', a: 'A cold refrigerator is best because gas solubility increases at lower temperatures; colder liquid keeps the CO₂ particles trapped in the solution longer.' },
             { q: 'Evaluate the use of a hot plate versus a Bunsen burner for evaporating seawater. Which is safer for preventing splashing errors?', a: 'A hot plate is better because it offers more precise temperature control, allowing for slow evaporation which prevents the salt from spitting or splashing out of the dish.' },
             
             
             

             { q: 'Evaluate whether muddy water is a solution. Defend your answer with evidence.', a: 'No, it is not a solution. Unlike salt water where particles spread evenly and don’t settle, dirt particles in muddy water are large enough to be seen and settle at the bottom over time, making it a suspension instead.' },
                  { q: 'Why is air considered a solution but fog is not? Explain the difference and evaluate how this classification helps us understand mixtures.', a: 'Air is a solution because gases like oxygen and nitrogen are mixed evenly at the particle level. Fog is not – it consists of visible water droplets suspended in air, not spread uniformly as particles. This classification helps us distinguish between stable, evenly mixed solutions and temporary suspensions.' },
                  { q: 'Evaluate the statement: "Water is the best solvent for all substances." Use examples to support your evaluation.', a: 'The statement is incorrect. Water dissolves many substances (like salt or sugar) but not others (like oil or wax). For example, oil particles do not mix evenly with water particles, so water is not a good solvent for it.' },
                  { q: 'Create a plan to separate salt from salt water, then evaluate if your method is practical for large-scale use.', a: 'Method: Heat salt water to evaporate the water (solvent), leaving solid salt (solute) behind. For small amounts, this is practical, but for large-scale use, it requires significant energy; alternative methods like reverse osmosis may be more efficient.' },
                  { q: 'If you want to make a solution that stays sweet even when cold, what factors would you consider and evaluate which is most important?', a: 'Factors include choosing a solute that dissolves well in cold liquid (e.g., fine sugar), adding the right amount (not too much to avoid undissolved crystals), and stirring thoroughly. The most important factor is selecting a suitable solute, as even with stirring, some substances won’t dissolve well in cold conditions.' },
{ q: 'Evaluate why it’s important to use a control group in some experiments. What happens if no control is used?', a: 'A control group provides a baseline to compare results against, showing if changes are due to the independent variable or other factors; without a control, it’s impossible to tell if observed effects are meaningful or just random variation, making conclusions unreliable.' },
{ q: 'Compare how qualitative and quantitative data differ in a scientific investigation. Give an example of each from a solubility experiment.', a: 'Qualitative data describes observations (e.g., sugar dissolves faster in hot water, solution becomes clear); quantitative data uses numbers (e.g., 10g sugar dissolves in 100mL water at 20°C, dissolution takes 2 minutes). Both are important, with qualitative data noting patterns and quantitative data providing precise measurements.' },
{ q: 'Why is it necessary to write down all steps of an experiment in detail?', a: 'Detailed procedures allow other scientists to repeat the experiment exactly to confirm results, help identify errors if results are unexpected, and ensure the investigation is reproducible – reproducibility is a key requirement for scientific findings to be accepted as valid.' },
{ q: 'Evaluate whether an experiment with one trial can produce reliable results. Justify your answer.', a: 'No, a single trial may be affected by random errors like inaccurate measurements or unexpected conditions; multiple trials are needed to see if results are consistent and to calculate an average, which reduces error and makes conclusions more trustworthy.' },
{ q: 'How would you identify and correct sources of error in an experiment on dissolution rate?', a: 'Common errors include inconsistent stirring, inaccurate temperature control, or imprecise measurements. Correct them by using a magnetic stirrer for consistency, a water bath to keep temperature steady, and calibrated tools with small measurement units; also, repeat trials to account for random variation.' },
{ q: 'Explain why scientists use graphs to present data. What advantages do graphs have over tables?', a: 'Graphs make patterns and relationships between variables easier to see at a glance (e.g., a line graph showing how solubility increases with temperature); tables show exact numbers but require more effort to interpret. Graphs help communicate results clearly to both scientists and non-scientists.' },
{ q: 'Evaluate the difference between an observation and a conclusion. How are they connected in an investigation?', a: 'An observation is what you directly see or measure (e.g., When fast-stirred, sugar dissolved in 90 seconds; when not stirred, it dissolved in 300 seconds). A conclusion is a logical interpretation drawn from observations and data (e.g., Stirring increases dissolving rate because it enhances contact between solute and solvent particles). They are connected because conclusions rely entirely on observational evidence to identify patterns and form valid explanations about the phenomenon being studied.'}, 
              { q: 'A label on a drink says contains 10g of sugar per 100mL. A student claims this means the concentration is 10% by mass. Evaluate whether this is correct. What additional information would be needed to confirm the percent by mass?', a: 'The claim is not necessarily correct. Mass per volume (g/mL) is not the same as percent by mass. To confirm percent by mass, we need the mass of the 100mL drink solution (not just its volume). For example, if 100mL of the drink has a mass of 105g, then 10g sugar would be ~9.5% by mass, not 10%. We need the density of the solution to convert volume to mass.' },
              { q: 'A manufacturer wants to make a more concentrated fruit juice. They are considering increasing the temperature to dissolve more sugar. Evaluate whether this is a good idea, considering how temperature affects solubility and what happens when the juice cools down.', a: 'Increasing temperature will dissolve more sugar (since solids become more soluble with heat), which is good for making a concentrated juice. However, if the juice cools down later, the solution may become supersaturated and sugar crystals may form, which could affect the juice’s texture and appearance. To avoid this, the manufacturer could either keep the juice warm, add stabilizers to prevent crystallization, or only dissolve the maximum amount of sugar that stays soluble at room temperature.' },
              { q: 'Some people think that if a solute doesn’t dissolve right away, it’s not soluble in that solvent. Evaluate this misconception and explain how to determine if a solute is soluble, including the role of temperature and maximum amount.', a: 'This is incorrect. Solubility does not depend on how quickly a solute dissolves. It depends on the maximum amount that can dissolve at a given temperature and pressure. A solute may dissolve slowly (e.g., a sugar cube in cold water) but still be highly soluble. To determine solubility, you need to: 1) Use enough solvent and time for dissolving to reach completion; 2) Test at a specific temperature; 3) Check if any undissolved solute remains. If some does, the solution is saturated, and the amount dissolved is the solubility limit.' },
              { q: 'Two solutions have the same concentration (g/L) but different solutes. Evaluate whether they will have the same properties (like taste or boiling point) and explain why or why not.', a: 'No, they will not have the same properties. Concentration measures the amount of solute, but the type of solute affects properties. For example: 10g/L salt solution tastes salty and has a higher boiling point than water; 10g/L sugar solution tastes sweet and has a different boiling point elevation. Different solutes interact differently with solvent molecules, leading to distinct physical and sensory properties.' },
              { q: 'Evaluate how understanding solubility helps in everyday life. Use examples like cooking, making drinks, or preserving food to justify its importance.', a: 'Understanding solubility is very useful in Cooking: Knowing that sugar dissolves better in hot water helps when making syrups or candies. Heating ensures maximum sugar dissolves for thick, sweet products. Making drinks: Understanding that gas solubility decreases with heat helps keep sodas cold to retain fizz; knowing how much powder to add to water ensures drinks are not too weak or too concentrated. Preserving food: Salt and sugar are used to preserve foods like pickles and jams because high concentrations draw water out of microbes (via osmosis) and create environments where microbes cannot grow. This relies on knowing how much solute is needed to reach effective concentrations. Without this knowledge, we might struggle to make desired products or keep food safe.' },
                         
             
             ]

  chemistry: {

      'use of models': {
        title: 'Lesson 1: Use of Models',
        modules: [
          { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to: <br>1. Recognize that scientists rely on models to explain concepts and phenomena.<br><br>2. Identify basic examples of models.' },
          { type: 'text', heading: 'Introduction', body: 'Have you ever tried to explain something that’s too big, too small, or too hard to see? Scientists face this same problem every day! To make things easier to understand, they use models. A simple representations of complex things or ideas.' },
          { type: 'text', heading: 'What are Scientific Models?', body: 'A scientific model is like a helper tool that scientists use to explain concepts and phenomena they can’t show directly. Think of it this way: if you wanted to tell a friend about the whole Earth, you couldn’t bring the real planet with you! Instead, you’d use a small version – a globe – to show how it looks, where countries are, and how it spins. That globe is a model.' },
          { type: 'text', heading: 'Key Idea:', body: 'Models make big, small, or invisible things easier to talk about, learn from, and understand.' },
          { type: 'text', heading: 'Examples of Basic Scientific Models', body: 'Models come in many forms, and you might already know some of them:' },
          { type: 'text', heading: '1. Globe for the Earth', body: 'The real Earth is huge, over 12,000 kilometers wide! A globe is a small, round model that shows us the shape of the Earth, continents, oceans, and how the North and South Poles are positioned. It even spins like the real Earth does.' },
        {type: 'image', url: 'https://imgur.com/FnpD99w.gif', caption: "Earths's Globe" },
        { type: 'text', heading: '2. Toy Car Model for Real Vehicles', body: 'A toy car that looks like a real car is a model. It shows us the basic shape, where wheels go, how doors open, and how the front and back are designed. Even though it’s not the same size or can’t drive like a real car, it helps us understand how real cars are built.' },
      {type: 'image', url: 'https://imgur.com/eArPdOY.gif', caption: 'Toy Car Model' },      
        { type: 'text', heading: '3. Drawing of the Water Cycle', body: 'You might have seen pictures that show how water goes up from oceans as vapor, forms clouds, and comes back down as rain. This drawing is a model. It simplifies the complex process of the water cycle so we can follow each step easily.' },
      {type: 'image', url: 'https://imgur.com/Qw9PDyJ.gif', caption: 'Water Cycle' },
       { type: 'text', heading: '4. Planetary Model of the Atom', body: 'The planetary atomic model is a scientific representation describing atoms as having a small, dense, positively charged central nucleus (containing protons and neutrons) with negatively charged electrons orbiting around it in fixed or loosely defined paths—analogous to planets orbiting the Sun.' },
        {type: 'image', url: 'https://imgur.com/LmlCYin.gif', caption: 'Planetary Atomic Model' },
      { type: 'text', heading: 'Summary', body: '• Scientists use models to explain concepts and phenomena that are hard to show directly.<br><br>•Models are simple representations of complex things.<br><br>• Common examples include globes (for Earth), toy cars (for real vehicles), water cycle drawings, and atom model kits.' },
        { type: 'text', heading: 'References', body: 'https://giphy.com/explore/globe<br><br>https://www.theatlantic.com/technology/archive/2025/06/tesla-doge-elon-musk/683217/<br><br>https://www.pinterest.com/pin/the-water-cycle-in-action--43417583903000592/<br><br> https://www.pinterest.com/pin/603482418806160554/' },

      'the particle model': {
        title: 'Lesson 2: The Particle Model and Changes of State',
        modules: [
        { type: 'text', heading: 'Objectives', body: 'By the end of this lesson learners will be able to:<br>1. Recognize that all matter is composed of tiny, invisible particles.<br><br>2. Describe that different substances are made up of different types of particles.<br><br>3. Identify particle arrangement/movement in solids, liquids, gases and link to their shape/volume properties.<br><br>4. Explain how heat causes state changes, and that particles rearrange but the substance stays the same.' },        
          { type: 'text', heading: 'Introduction', body: 'Look around you. Everything you can see and touch is made of matter. Your pencil, your book, the air you breathe, even water, all of it is matter. But what is matter made of when you look at it really closely?' },
        { type: 'image', url: 'https://imgur.com/ayJzgnq.gif', caption: 'Pencil' },
        { type: 'image', url: 'https://imgur.com/JshJ7QN.gif', caption: 'Book' },
        { type: 'image', url: 'https://imgur.com/KJ4bB3O.gif', caption: 'Air' },
        { type: 'image', url: 'https://imgur.com/gFuU5oJ.gif', caption: 'Water' },
        { type: 'text', heading: 'All Matter is Made of Tiny Particles', body: 'Imagine taking a piece of chocolate and breaking it into smaller and smaller pieces. Even when it’s too small to see with your eyes, there are still tiny bits of chocolate left. These tiny bits are called particles.' },        
        { type: 'image', url: 'https://imgur.com/a5ow3Xm.png', caption: 'Chocolate' },
        { type: 'text', heading: 'Key Idea', body: 'Every single thing that is matter is made up of tiny, invisible particles that are too small to see with just our eyes.<br><br>You can’t see these particles, but we know they’re there because of many experiments scientists have done. For example, when you add sugar to water and stir it, the sugar seems to disappear but it’s just broken into tiny particles that spread out between the water particles.' },        
        { type: 'text', heading: 'Different Substances Have Different Particles', body: 'Just like different toys are made of different parts, different substances are made of different types of particles.<br><br>•The particles that make up water are not the same as the particles that make up salt. That’s why water is wet and clear, while salt is dry and white.<br><br>•The particles that make up wood are different from the particles that make up metal. That’s why wood can burn and float, while metal is strong and sinks in water.' },        
        { type: 'text', heading: 'Key Idea', body: 'Each substance has its own unique type of particles, which is why different things look, feel, and act differently.' },        
        { type: 'text', heading: 'Summary', body: '• All matter (everything around us) is composed of tiny, invisible particles.<br><br> •We can’t see these particles with our eyes, but we know they exist.<br><br>• Different substances are made up of different types of particles. This is what makes each thing unique.' },        
        { type: 'text', heading: 'References', body: 'https://www.shutterstock.com/search/dark-chocolate-pieces<br><br>https://classroomclipart.com/image/vector-clipart/pencil-6-28-39171.htm<br><br>https://tenor.com/search/book-gifs<br><br>https://in.pinterest.com/pin/627196685605519501/<br><br>https://usagif.com/water-gifs/?srsltid=AfmBOoq5976MOoz6LMYFr6skFbr_KOWcYhVqcvmc02TPyQK4H1J4VDrY<br><br>https://giphy.com/explore/air-breathe'},
